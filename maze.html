<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노유기 한밤 미로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 오락실 기계 한 대 — 위 간판, 가운데 화면(캔버스), 십자 단추, 아래 단추 줄. 한 가지 화면(어두운 브라운관)만 쓴다 */
:root{
  --void:#0B0A1F; --cab:#15133A; --ink:#EEF0FF; --dim:#8C90C8; --line:#2B2A66;
  --pink:#FF4F8B; --lemon:#FFD43B; --mint:#3BE0B4; --cobalt:#5C6CFF;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --f-head:'Do Hyeon','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--f-body); overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px, rgba(92,108,255,.14) 1px, transparent 0); background-size:14px 14px}
#app{height:100%; display:flex; flex-direction:column; align-items:center; padding-inline:16px; box-sizing:border-box}
.marquee{flex:none; display:flex; align-items:baseline; justify-content:center; gap:10px; padding-block:8px 6px}
.marquee b{font-family:var(--f-pixel); font-weight:400; font-size:12px; letter-spacing:.12em; color:var(--lemon);
  text-shadow:0 0 6px rgba(255,212,59,.6), 2px 2px 0 var(--pink)}
.marquee span{font-family:var(--f-head); font-size:14px; color:var(--dim)}
#wrap{flex:1; min-height:0; width:100%; display:grid; place-items:center}
#stage{position:relative; border-radius:10px; overflow:hidden; box-shadow:0 0 0 3px var(--line), 0 0 40px rgba(92,108,255,.25);
  touch-action:none; user-select:none; -webkit-user-select:none; background:var(--void)}
#cv{display:block}
#stage::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.14) 2px 3px),
             radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.4) 100%)}
.ov{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:24px 18px; text-align:center; background:rgba(11,10,31,.62)}
.eyebrow{font-family:var(--f-head); font-size:16px; color:var(--mint); letter-spacing:.04em}
.logo{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(24px,8vw,34px); line-height:1.35; color:var(--lemon);
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--cobalt); text-wrap:balance}
.how{max-width:28ch; margin:0; font-size:15px; line-height:1.7; color:var(--ink)}
.how em{font-style:normal; color:var(--lemon)}
.btn{font-family:var(--f-head); font-size:22px; border:3px solid var(--ink); border-radius:12px; padding:10px 22px 8px;
  background:var(--lemon); color:var(--void); cursor:pointer; box-shadow:0 5px 0 var(--pink)}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:0 5px 0 var(--line); font-size:18px}
.btn:focus-visible,.mini:focus-visible,.pad button:focus-visible{outline:3px solid var(--mint); outline-offset:3px}
.coin{font-family:var(--f-pixel); font-size:11px; color:var(--pink); animation:blink 1.1s steps(2) infinite}
.hi{font-family:var(--f-pixel); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.15}}
.big{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:26px; color:var(--pink); text-shadow:3px 3px 0 var(--cobalt)}
.stats{display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:15px; align-items:baseline; margin:0}
.stats dt{color:var(--dim); text-align:right}
.stats dd{margin:0; text-align:left; font-family:var(--f-pixel); font-size:12px; font-variant-numeric:tabular-nums}
.rec{margin:0; font-family:var(--f-head); font-size:19px; color:var(--lemon)}

  border-radius:11px; cursor:pointer; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; padding:0}
.pad button.on,.pad button:active{background:var(--cobalt); border-color:var(--ink)}
.pad .u{grid-column:2; grid-row:1} .pad .l{grid-column:1; grid-row:2} .pad .d{grid-column:2; grid-row:2} .pad .r{grid-column:3; grid-row:2}
.bar{flex:none; display:flex; align-items:center; gap:10px; padding-block:6px calc(8px + env(safe-area-inset-bottom,0px));
  width:100%; max-width:480px; justify-content:space-between}
.mini{font-family:var(--f-head); font-size:15px; background:var(--cab); color:var(--ink); border:2px solid var(--line);

.mini[aria-pressed="true"]{color:var(--dim)}
.copy{font-size:12px; color:var(--dim)}

<div id="app">
  <div class="marquee"><b>NOYUGI ARCADE</b><span>4번 기계</span></div>

    <button class="mini" id="soundBtn" type="button" aria-pressed="false">소리 켬</button>
    <span class="copy">© 2026 노유기</span>
    <button class="mini" id="pauseBtn" type="button">일시정지</button>
  </div>
</div>

<script>
(() => {
'use strict';

/*PURE-START*/
/* ---------- 미로 · 길 찾기 · 걷기 (화면 없이 node 로 시험하는 부분) ---------- */
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];          // 0 위 · 1 오른쪽 · 2 아래 · 3 왼쪽
const opp = d => (d + 2) & 3;
function canGo(m, x, y, d){ return ((m.open[y * m.cols + x] >> d) & 1) === 1; }

// 재귀 백트래킹(반복문 판) + 벽 몇 개를 더 허물어 고리를 만든다
function genMaze(cols, rows, rnd){
  rnd = rnd || Math.random;
  const n = cols * rows, open = new Uint8Array(n), seen = new Uint8Array(n);
  const st = [Math.floor(rnd() * n)]; seen[st[0]] = 1;
  while (st.length) {
    const c = st[st.length - 1], x = c % cols, y = (c / cols) | 0, cand = [];
    for (let d = 0; d < 4; d++) {
      const nx = x + DX[d], ny = y + DY[d];
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      if (!seen[ny * cols + nx]) cand.push(d);
    }
    if (!cand.length) { st.pop(); continue; }
    const d = cand[Math.floor(rnd() * cand.length)], nc = (y + DY[d]) * cols + x + DX[d];
    open[c] |= 1 << d; open[nc] |= 1 << opp(d); seen[nc] = 1; st.push(nc);
  }
  let extra = Math.max(2, Math.floor(n * 0.07)), tries = extra * 40;
  while (extra > 0 && tries-- > 0) {
    const x = Math.floor(rnd() * cols), y = Math.floor(rnd() * rows), d = Math.floor(rnd() * 4);
    const nx = x + DX[d], ny = y + DY[d];
    if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
    const c = y * cols + x;
    if ((open[c] >> d) & 1) continue;
    open[c] |= 1 << d; open[ny * cols + nx] |= 1 << opp(d); extra--;
  }
  return { cols, rows, open };
}
function bfs(m, sx, sy){
  const dist = new Int16Array(m.cols * m.rows).fill(-1), q = [sy * m.cols + sx];
  dist[q[0]] = 0;
  for (let i = 0; i < q.length; i++) {
    const c = q[i], x = c % m.cols, y = (c / m.cols) | 0;
    for (let d = 0; d < 4; d++) {
      if (!((m.open[c] >> d) & 1)) continue;
      const nc = (y + DY[d]) * m.cols + x + DX[d];
      if (dist[nc] < 0) { dist[nc] = dist[c] + 1; q.push(nc); }
    }
  }
  return dist;
}
const VW = 360, TOPY = 56, BOTY = 10, SIDE = 8;
function layout(stage, H){
  const cols = Math.min(15, 6 + stage), cell = Math.floor((VW - 2 * SIDE) / cols);
  const rows = Math.max(6, Math.min(32, Math.floor((H - TOPY - BOTY) / cell)));
  const ox = Math.round((VW - cols * cell) / 2);
  const oy = TOPY + Math.round(Math.max(0, H - TOPY - BOTY - rows * cell) / 2);
  return { cols, rows, cell, ox, oy };
}
// 시작(네 모서리 중 하나) · 출구(가장 먼 쪽) · 글자 · 보물 · 캐릭터 자리
function placeItems(m, nLetters, nTreas, nMon, rnd){
  rnd = rnd || Math.random;
  const C = m.cols, R = m.rows, n = C * R, pickI = a => a[Math.floor(rnd() * a.length)];
  const corners = [[0, 0], [C - 1, 0], [0, R - 1], [C - 1, R - 1]], sc = pickI(corners);
  const start = { x: sc[0], y: sc[1] }, ds = bfs(m, start.x, start.y);
  let maxD = 0; for (let i = 0; i < n; i++) if (ds[i] > maxD) maxD = ds[i];
  const far = []; for (let i = 0; i < n; i++) if (ds[i] >= Math.floor(maxD * 0.85)) far.push(i);
  const ei = pickI(far), exit = { x: ei % C, y: (ei / C) | 0 };
  const used = new Set([start.y * C + start.x, ei]);
  const pool = minD => { const a = []; for (let i = 0; i < n; i++) if (!used.has(i) && ds[i] >= minD) a.push(i); return a.length ? a : (() => { const b = []; for (let i = 0; i < n; i++) if (!used.has(i)) b.push(i); return b; })(); };
  const xy = i => ({ x: i % C, y: (i / C) | 0 });
  const letters = [];
  for (let k = 0; k < nLetters; k++) {
    const p = pool(3); let best = -1, bs = -1;
    for (let t = 0; t < 14; t++) {            // 서로 멀리 흩어지도록 열네 곳 중 가장 외진 곳
      const c = pickI(p), q = xy(c); let md = 1e9;
      for (const o of letters.concat([start, exit])) md = Math.min(md, Math.hypot(o.x - q.x, o.y - q.y));
      if (md > bs) { bs = md; best = c; }
    }
    used.add(best); letters.push(xy(best));
  }
  const treasures = [];
  for (let k = 0; k < nTreas; k++) { const c = pickI(pool(3)); used.add(c); treasures.push(xy(c)); }
  const thr = Math.min(8, Math.floor(maxD * 0.35)), mons = [];
  for (let k = 0; k < nMon; k++) { const c = pickI(pool(thr)); mons.push(xy(c)); }
  return { start, exit, letters, treasures, mons, maxD, thr, ds };
}
function mkWalker(x, y){ return { cx: x, cy: y, dir: 1, moving: false, prog: 0, fx: x, fy: y, last: -1 }; }
function reverseWalker(w){
  if (!w.moving) return;
  w.cx += DX[w.dir]; w.cy += DY[w.dir]; w.prog = 1 - w.prog; w.dir = opp(w.dir);
}
// 칸 사이를 부드럽게 걷는다. 칸 가운데에 닿을 때마다 decide 로 다음 방향을 묻는다(-1 이면 멈춤)
function stepWalker(m, w, dt, speed, decide){
  let dist = speed * dt, guard = 0;
  while (dist > 1e-9 && guard++ < 6) {
    if (!w.moving) {
      const d = decide(w);
      if (d === undefined || d < 0 || !canGo(m, w.cx, w.cy, d)) break;
      w.dir = d; w.last = d; w.moving = true; w.prog = 0;
    }
    const rem = 1 - w.prog;
    if (dist >= rem) { w.cx += DX[w.dir]; w.cy += DY[w.dir]; w.prog = 0; w.moving = false; dist -= rem; }
    else { w.prog += dist; dist = 0; }
  }
  w.fx = w.cx + (w.moving ? DX[w.dir] * w.prog : 0);
  w.fy = w.cy + (w.moving ? DY[w.dir] * w.prog : 0);
}
// 주인공: 누른 방향이 열려 있으면 그쪽, 아니면 하던 방향으로 계속, 막히면 멈춤
function heroDecide(m, w, want){
  if (want < 0) return -1;
  if (canGo(m, w.cx, w.cy, want)) return want;
  if (w.last >= 0 && canGo(m, w.cx, w.cy, w.last)) return w.last;
  return -1;
}
// 캐릭터: 가까우면(range 칸 안) smart 확률로 주인공 쪽으로, 아니면 돌아다닌다. dist 는 주인공 칸에서 잰 길 거리
function monDecide(m, dist, o, rnd){
  rnd = rnd || Math.random;
  const dirs = []; for (let d = 0; d < 4; d++) if (canGo(m, o.cx, o.cy, d)) dirs.push(d);
  if (!dirs.length) return { dir: -1, chasing: false };
  const here = dist[o.cy * m.cols + o.cx];
  if (here >= 0 && here <= o.range && rnd() < o.smart) {
    let best = 1e9, bl = [];
    for (const d of dirs) {
      const v = dist[(o.cy + DY[d]) * m.cols + o.cx + DX[d]];
      if (v < best) { best = v; bl = [d]; } else if (v === best) bl.push(d);
    }
    return { dir: bl[Math.floor(rnd() * bl.length)], chasing: true };
  }
  let cand = dirs.filter(d => d !== opp(o.dir)); if (!cand.length) cand = dirs;
  if (cand.indexOf(o.dir) >= 0 && rnd() < 0.55) return { dir: o.dir, chasing: false };
  return { dir: cand[Math.floor(rnd() * cand.length)], chasing: false };
}
/*PURE-END*/

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stageEl = $('stage'), wrapEl = $('wrap');
const W = VW; let H = 640, scale = 1, dpr = 1;
const FP = '"Press Start 2P", monospace', FK = '"Do Hyeon", sans-serif';
const C = { void:'#0B0A1F', ink:'#EEF0FF', dim:'#8C90C8', line:'#2B2A66', pink:'#FF4F8B', lemon:'#FFD43B', mint:'#3BE0B4', cobalt:'#5C6CFF', floor:'#1C1A4A', floor2:'#211F55', wall:'#8E98FF' };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const pad = (n, l) => String(n).padStart(l, '0');
const fmtTime = s => { s = Math.floor(s); return Math.floor(s / 60) + ':' + pad(s % 60, 2); };

/* ---------- 저장(이 기기에만) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let hi = store.get('nyg-maze-hi', 0);
let muted = store.get('nyg-maze-muted', false);

/* ---------- 소리 ---------- */
let AC = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay){
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
let noiseBuf = null;
function noise(d, v){
  if (muted) return; const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .6, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d);
}
const sfx = {
  coin(){ tone(988, .07, 'square', .05); tone(1319, .28, 'square', .05, null, .07); },
  letter(){ tone(740, .06, 'triangle', .06); tone(1109, .1, 'triangle', .06, null, .05); },
  door(){ [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, .14, 'triangle', .06, null, i * .07)); noise(.25, .04); },
  locked(){ tone(150, .12, 'square', .04); tone(120, .14, 'square', .04, null, .09); },
  star(){ [784, 988, 1319, 1568].forEach((f, i) => tone(f, .09, 'triangle', .06, null, i * .05)); },
  clock(){ tone(1400, .04, 'square', .03); tone(1000, .04, 'square', .03, null, .12); tone(1400, .04, 'square', .03, null, .24); tone(600, .3, 'triangle', .05, 300, .36); },
  lamp(){ tone(330, .35, 'sine', .06, 880); tone(660, .35, 'sine', .04, 1320, .06); },
  beat(){ tone(95, .09, 'sine', .07, 60); tone(80, .09, 'sine', .05, 55, .13); },
  hurt(){ tone(320, .55, 'sawtooth', .07, 50); noise(.5, .14); },
  clear(){ [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .12, 'square', .045, null, i * .07)); },
  up(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .09, 'triangle', .07, null, i * .06)); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .28, 'triangle', .08, null, i * .24)); }
};

// 등급별 똑똑함: 쫓기 시작하는 거리(칸) · 쫓을 확률 · 걸음 보태기(칸/초)

const WORDS = {
  3: [['SUN','해'],['SKY','하늘'],['KEY','열쇠'],['MAP','지도'],['OWL','부엉이'],['BAT','박쥐'],['FOG','안개'],['ICE','얼음'],['GEM','보석'],['FOX','여우'],['BEE','꿀벌'],['CAT','고양이'],['EGG','달걀'],['HAT','모자'],['JAM','잼'],['NET','그물'],['ZOO','동물원'],['BOX','상자']],

  5: [['NIGHT','밤'],['TORCH','횃불'],['TRAIL','자취'],['QUEST','임무'],['BRAVE','용감한'],['FLAME','불꽃'],['SPARK','불꽃'],['MAGIC','마법'],['ALARM','경보'],['DREAM','꿈'],['CROWN','왕관'],['LIGHT','빛'],['STONE','돌'],['CLOUD','구름']],

const recentWords = [];
function wordLenFor(stage){ return Math.min(6, 3 + Math.floor((stage - 1) / 2)); }
function pickWord(stage){
  const len = wordLenFor(stage);
  let pool = WORDS[len].filter(w => typeof w[0] === 'string' && w[0].length === len && recentWords.indexOf(w[0]) < 0);
  if (!pool.length) pool = WORDS[len].filter(w => typeof w[0] === 'string' && w[0].length === len);
  const w = pick(pool);
  recentWords.push(w[0]); if (recentWords.length > 10) recentWords.shift();
  return w;
}

/* ---------- 어휘 카드 (어휘카드.js) ---------- */
function nextVocab(){
  try { if (typeof NYGVocab !== 'undefined') return NYGVocab.next(); } catch(e){}
  return ['bounce back', '다시 회복하다'];
}

function stopSpeech(){ try { if (typeof NYGVocab !== 'undefined') NYGVocab.stop(); } catch(e){} }

/* ---------- 상태 ---------- */
let state = 'title', G = null, parts = [], pops = [], banners = [];
let tAnim = 0, beatT = 0;
const mazeCv = document.createElement('canvas'), memCv = document.createElement('canvas'), litCv = document.createElement('canvas');
const mazeX = mazeCv.getContext('2d'), memX = memCv.getContext('2d'), litX = litCv.getContext('2d');

function stageMonCount(stage){ return Math.min(8, 1 + Math.floor(stage * 0.7)); }
function pickFoe(stage){
  const w = { N: Math.max(20, 58 - 4 * stage), R: 30, SR: stage >= 2 ? 10 + 2 * stage : 0, SSR: stage >= 4 ? 2 + stage : 0 };
  const list = FOES.filter(c => w[c.r] > 0);
  if (!list.length) return null;
  const bag = []; list.forEach(c => { const k = Math.max(1, Math.round(w[c.r] / list.filter(x => x.r === c.r).length)); for (let i = 0; i < k; i++) bag.push(c); });
  return pick(bag);
}
function newStageData(stage, demo){
  const L = layout(stage, H), m = genMaze(L.cols, L.rows);
  const word = pickWord(stage);
  const nTreas = stage === 1 ? 1 : (Math.random() < .55 ? 2 : 1);
  const it = placeItems(m, word[0].length, nTreas, demo ? 3 : stageMonCount(stage), Math.random);
  const chars = [...word[0]].sort(() => Math.random() - .5);
  const types = ['star', 'clock', 'lantern'].sort(() => Math.random() - .5);
  const base = Math.min(4.0, 2.3 + .17 * stage);
  const mons = it.mons.map((p, i) => {
    const ch = pickFoe(demo ? 1 : stage) || { id: 'x', r: 'N', name: '?' }, br = BRAIN[ch.r];
    const w = mkWalker(p.x, p.y); w.dir = Math.floor(Math.random() * 4);
    return Object.assign(w, { ch, range: demo ? 0 : br.range, smart: br.smart, speed: Math.min(4.5, base + br.add), chasing: false, sleep: 0 });
  });
  const hero = mkWalker(it.start.x, it.start.y);
  return {
    stage, L, m, word: word[0], ko: word[1], start: it.start, exit: it.exit, ds: it.ds, thr: it.thr, maxD: it.maxD,
    letters: it.letters.map((p, i) => ({ x: p.x, y: p.y, ch: chars[i], got: false, seen: false, ph: Math.random() * 6 })),
    treasures: it.treasures.map((p, i) => ({ x: p.x, y: p.y, type: types[i % 3], got: false, seen: false, ph: Math.random() * 6 })),
    mons, hero, got: Array(word[0].length).fill(false), door: false, seenExit: false,
    want: -1, hcell: -1, dist: null, grace: 1.6, inv: 0, boost: 0, freeze: 0, peek: 0, stageT: 0, clearT: 0, lightMul: 1,
    vis: new Uint8Array(L.cols * L.rows), card: null, dead: false, rings: [], shake: 0, flash: 0, hurtFlash: 0, lockMsgT: 0
  };
}
function newGame(demo){
  const s = newStageData(1, demo);
  G = Object.assign({ demo: !!demo, score: 0, lives: 3, escaped: 0, time: 0, words: [] }, s);
  parts = []; pops = []; banners = [];
  rebuildLayers();
  if (!demo) { banner('MAZE 1', '글자를 모아 문을 열어요', C.mint); }
}
function nextStage(){
  const keep = { demo: G.demo, score: G.score, lives: G.lives, escaped: G.escaped, time: G.time, words: G.words };
  const s = newStageData(G.stage + 1, false);
  G = Object.assign(keep, s);
  parts = []; pops = [];
  rebuildLayers();
  banner('MAZE ' + G.stage, '이번 단어는 ' + G.word.length + '글자', C.mint);
}
function banner(text, sub, color, big){ banners.push({ text, sub, color: color || C.lemon, t: 0, life: big ? 1.9 : 1.6, big: !!big }); }
function burst(x, y, color, n, spd){
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), s = rnd(30, spd || 150);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.35, .8), t: 0, color, size: pick([2, 2, 3]) }); }
}
const cxPx = fx => G.L.ox + (fx + .5) * G.L.cell;
const cyPx = fy => G.L.oy + (fy + .5) * G.L.cell;
function heroCellOf(w){ return (w.moving && w.prog > .5) ? (w.cy + DY[w.dir]) * G.m.cols + w.cx + DX[w.dir] : w.cy * G.m.cols + w.cx; }
function lightR(){
  const c = G.L.cell;
  return (2.6 * c + 24) * G.lightMul * (1 + .012 * Math.sin(tAnim * 7));
}

/* ---------- 갱신 ---------- */
function respawn(){
  const h = G.hero; h.cx = G.start.x; h.cy = G.start.y; h.moving = false; h.prog = 0; h.fx = h.cx; h.fy = h.cy; h.last = -1;
  G.want = -1; G.dead = false; G.inv = 2.6; G.grace = 1.2; G.hcell = -1;
  const ds = G.ds, m = G.m, n = m.cols * m.rows, far = [];
  for (let i = 0; i < n; i++) if (ds[i] >= G.thr) far.push(i);
  for (const o of G.mons) {                        // 시작점 가까이 있던 캐릭터는 멀리 옮긴다
    if (ds[o.cy * m.cols + o.cx] < 6 && far.length) {
      const c = pick(far); o.cx = c % m.cols; o.cy = (c / m.cols) | 0; o.moving = false; o.prog = 0; o.fx = o.cx; o.fy = o.cy;
    }
  }
}
function update(dt){
  tAnim += dt;
  const advParts = () => { for (const p of parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .98; p.vy *= .98; } parts = parts.filter(p => p.t < p.life); };
  if (!G) return;
  if (state === 'title') { demoStep(dt); advParts(); return; }
  if (state !== 'play') { advParts(); return; }

  // 어휘 카드가 떠 있는 동안 게임은 멈춘다
  if (G.card) {
    const c = G.card; c.t += dt; advParts();
    for (const r of G.rings) r.t += dt;
    G.rings = G.rings.filter(r => r.t < r.life);
    G.shake = Math.max(0, G.shake - dt * 2); G.hurtFlash = Math.max(0, G.hurtFlash - dt * 4);
    if (c.skip || (c.t >= 4 && c.spoken) || c.t >= 9) { G.card = null; stopSpeech(); if (G.lives <= 0) { gameOver(); return; } respawn(); }
    return;
  }
  advParts();
  for (const p of pops) { p.t += dt; p.y -= 24 * dt; } pops = pops.filter(p => p.t < .9);
  for (const b of banners) b.t += dt; banners = banners.filter(b => b.t < b.life);
  for (const r of G.rings) r.t += dt; G.rings = G.rings.filter(r => r.t < r.life);
  G.shake = Math.max(0, G.shake - dt * 2); G.flash = Math.max(0, G.flash - dt * 3); G.hurtFlash = Math.max(0, G.hurtFlash - dt * 4);
  G.lockMsgT = Math.max(0, G.lockMsgT - dt);

  if (G.clearT > 0) { G.clearT -= dt; if (G.clearT <= 0) nextStage(); return; }

  G.time += dt; G.stageT += dt;
  G.inv = Math.max(0, G.inv - dt); G.grace = Math.max(0, G.grace - dt);
  G.boost = Math.max(0, G.boost - dt); G.freeze = Math.max(0, G.freeze - dt); G.peek = Math.max(0, G.peek - dt);
  const tgt = G.boost > 0 ? 1.55 : 1; G.lightMul += (tgt - G.lightMul) * Math.min(1, dt * 5);

  // 주인공
  const h = G.hero;
  if (G.want >= 0 && h.moving && G.want === opp(h.dir)) reverseWalker(h);
  stepWalker(G.m, h, dt, HERO_SPEED, w => heroDecide(G.m, w, G.want));
  const hc = heroCellOf(h);
  if (hc !== G.hcell) { G.hcell = hc; G.dist = bfs(G.m, hc % G.m.cols, (hc / G.m.cols) | 0); }
  const hx = cxPx(h.fx), hy = cyPx(h.fy), R = lightR();
  markSeen(hx, hy, R);

  // 글자 · 보물 · 문
  for (const l of G.letters) {
    if (l.got) continue;
    if (Math.hypot(h.fx - l.x, h.fy - l.y) < .55) {
      l.got = true; const i = G.got.findIndex((g, k) => !g && G.word[k] === l.ch); if (i >= 0) G.got[i] = true;
      G.score += 100; sfx.letter(); burst(cxPx(l.x), cyPx(l.y), C.lemon, 14, 120);
      pops.push({ x: cxPx(l.x), y: cyPx(l.y) - 8, text: l.ch + ' +100', t: 0, color: C.lemon });
      if (G.got.every(Boolean)) {
        G.door = true; G.score += 200; G.flash = RM ? 0 : .6; sfx.door();
        banner(G.word + '!', G.ko + ' · 문이 열렸어요', C.lemon, true); G.words.push(G.word);
      }
    }
  }
  for (const t of G.treasures) {
    if (t.got || Math.hypot(h.fx - t.x, h.fy - t.y) >= .55) continue;
    t.got = true; G.score += 50; burst(cxPx(t.x), cyPx(t.y), C.mint, 18, 140);
    if (t.type === 'star') { G.boost = 12; sfx.star(); pops.push({ x: hx, y: hy - 14, text: '빛이 커져요', t: 0, color: C.lemon }); }
    else if (t.type === 'clock') { G.freeze = 4.5; sfx.clock(); pops.push({ x: hx, y: hy - 14, text: '모두 멈췄어요', t: 0, color: '#9EE7FF' }); }
    else { G.peek = 4; sfx.lamp(); pops.push({ x: hx, y: hy - 14, text: '지도가 보여요', t: 0, color: C.pink }); }
  }
  if (Math.hypot(h.fx - G.exit.x, h.fy - G.exit.y) < .45) {
    if (G.door) stageClear();
    else if (G.lockMsgT <= 0) { G.lockMsgT = 1.2; sfx.locked(); const rest = G.got.filter(g => !g).length; pops.push({ x: hx, y: hy - 14, text: '글자 ' + rest + '개 더', t: 0, color: C.pink }); }
  }

  // 캐릭터
  let nearest = 99;
  for (const o of G.mons) {
    const dd = Math.hypot(h.fx - o.fx, h.fy - o.fy);
    if (G.freeze <= 0 && G.grace <= 0 && G.dist) {
      const sp = o.chasing ? o.speed : o.speed * .78;
      stepWalker(G.m, o, dt, sp, w => { const r = monDecide(G.m, G.dist, w); w.chasing = r.chasing; return r.dir; });
    }
    if (G.freeze <= 0) nearest = Math.min(nearest, dd);
    if (G.inv <= 0 && !G.dead && Math.hypot(h.fx - o.fx, h.fy - o.fy) < .55) { hurt(); break; }
  }
  beatT -= dt;
  if (nearest < 3.2 && beatT <= 0) { sfx.beat(); beatT = .5 + nearest * .1; }
}
function demoStep(dt){
  // 첫 화면: 주인공이 혼자 돌아다니고 캐릭터도 어슬렁거린다
  const h = G.hero, m = G.m;
  stepWalker(m, h, dt, 3.6, w => { const ds = []; for (let d = 0; d < 4; d++) if (canGo(m, w.cx, w.cy, d)) ds.push(d); let c = ds.filter(d => d !== opp(w.dir)); if (!c.length) c = ds; return (c.indexOf(w.dir) >= 0 && Math.random() < .5) ? w.dir : pick(c); });
  if (!G.noDist) G.noDist = new Int16Array(m.cols * m.rows).fill(-1);
  for (const o of G.mons) stepWalker(m, o, dt, 2.2, w => monDecide(m, G.noDist, w).dir);
  const R = lightR(); markSeen(cxPx(h.fx), cyPx(h.fy), R);
}
function stageClear(){
  const bonus = 200 + 100 * G.stage + Math.max(0, Math.round(40 + 6 * G.stage - G.stageT)) * 10;
  G.score += bonus; G.escaped++; G.clearT = 1.7; G.flash = RM ? 0 : .5; sfx.clear();
  const h = G.hero; burst(cxPx(h.fx), cyPx(h.fy), C.mint, 36, 220); burst(cxPx(h.fx), cyPx(h.fy), C.lemon, 24, 180);
  banner('ESCAPE!', '+' + bonus + '점', C.mint, true);
  if (G.escaped % 4 === 0 && G.lives < 5) { G.lives++; setTimeout(() => { banner('1UP', '목숨 하나 더', C.pink); sfx.up(); }, 900); }

}
function hurt(){
  G.lives--; G.dead = true; G.shake = RM ? 0 : .7; G.hurtFlash = RM ? 0 : 1; G.want = -1;
  const h = G.hero, x = cxPx(h.fx), y = cyPx(h.fy);
  burst(x, y, C.lemon, 40, 260); burst(x, y, C.pink, 30, 200); burst(x, y, '#FFFFFF', 14, 120);
  G.rings.push({ x, y, t: 0, life: .6, r: 170, color: C.lemon }, { x, y, t: -.12, life: .7, r: 120, color: C.pink });
  const v = nextVocab(); G.card = { en: v[0], ko: v[1], t: 0, spoken: false, skip: false };
  const card = G.card; setTimeout(() => { if (G && G.card === card) speakCard(card); }, 500);

}
function gameOver(){

/* ---------- 미로 그림 (한 번 그려 두고 빛으로 비춘다) ---------- */
function rebuildLayers(){
  const w = cv.width, h = cv.height;
  for (const c of [mazeCv, memCv, litCv]) { c.width = w; c.height = h; }
  if (!G) return;
  const s = w / W, { L, m } = G, cell = L.cell, tw = Math.max(3, Math.round(cell * .13));
  mazeX.setTransform(s, 0, 0, s, 0, 0);
  mazeX.fillStyle = C.void; mazeX.fillRect(0, 0, W, H);
  for (let y = 0; y < L.rows; y++) for (let x = 0; x < L.cols; x++) {
    mazeX.fillStyle = (x + y) & 1 ? C.floor : C.floor2; mazeX.fillRect(L.ox + x * cell, L.oy + y * cell, cell, cell);
  }
  const seg = (x1, y1, x2, y2) => { mazeX.beginPath(); mazeX.moveTo(x1, y1); mazeX.lineTo(x2, y2); mazeX.stroke(); };
  const walls = () => {
    for (let y = 0; y < L.rows; y++) for (let x = 0; x < L.cols; x++) {
      const px = L.ox + x * cell, py = L.oy + y * cell;
      if (!canGo(m, x, y, 0)) seg(px, py, px + cell, py);
      if (!canGo(m, x, y, 3)) seg(px, py, px, py + cell);
      if (y === L.rows - 1) seg(px, py + cell, px + cell, py + cell);
      if (x === L.cols - 1) seg(px + cell, py, px + cell, py + cell);
    }
  };
  mazeX.lineCap = 'round';
  mazeX.strokeStyle = C.void; mazeX.lineWidth = tw + 3; walls();
  mazeX.strokeStyle = C.wall; mazeX.lineWidth = tw; walls();
  // 지나간 길 기억 다시 칠하기
  memX.setTransform(1, 0, 0, 1, 0, 0); memX.clearRect(0, 0, w, h);
  for (let i = 0; i < G.vis.length; i++) if (G.vis[i]) revealCell(i);
}
function revealCell(i){
  const s = cv.width / W, { L } = G, x = i % L.cols, y = (i / L.cols) | 0, e = 3;
  const sx = Math.max(0, Math.floor((L.ox + x * L.cell) * s) - e), sy = Math.max(0, Math.floor((L.oy + y * L.cell) * s) - e);
  const sw = Math.min(cv.width - sx, Math.ceil(L.cell * s) + 2 * e), sh = Math.min(cv.height - sy, Math.ceil(L.cell * s) + 2 * e);
  if (sw > 0 && sh > 0) memX.drawImage(mazeCv, sx, sy, sw, sh, sx, sy, sw, sh);
}
function markSeen(hx, hy, R){
  const { L } = G, c = L.cell, r = R * .78;
  const x0 = Math.max(0, Math.floor((hx - r - L.ox) / c)), x1 = Math.min(L.cols - 1, Math.floor((hx + r - L.ox) / c));
  const y0 = Math.max(0, Math.floor((hy - r - L.oy) / c)), y1 = Math.min(L.rows - 1, Math.floor((hy + r - L.oy) / c));
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * L.cols + x; if (G.vis[i]) continue;
    if (Math.hypot(L.ox + (x + .5) * c - hx, L.oy + (y + .5) * c - hy) < r) { G.vis[i] = 1; revealCell(i); }
  }
}

/* ---------- 그리기 ---------- */
function drawStar(x, y, r, color){
  ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = C.void; ctx.stroke();
}
function drawTreasure(type, x, y, s, t){
  const bob = Math.sin(t * 3) * s * .06; y += bob;
  ctx.save();
  const g = ctx.createRadialGradient(x, y, 0, x, y, s * .9);
  const col = type === 'star' ? '255,212,59' : type === 'clock' ? '158,231,255' : '255,79,139';
  g.addColorStop(0, 'rgba(' + col + ',.45)'); g.addColorStop(1, 'rgba(' + col + ',0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s * .9, 0, 7); ctx.fill();

addEventListener('keydown', e => {

  else if ((e.key === 'Enter' || e.key === ' ') && state === 'play' && G && G.card) { if (G.card.t > 1.5) G.card.skip = true; e.preventDefault(); }

let swipe = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  if (G.card) { if (G.card.t > 1.5) G.card.skip = true; return; }

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;

  const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); msg.textContent = '글자를 길게 눌러 복사해 주세요'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = '복사했어요. 카페 인증 글에 붙여 넣으세요'; }, fallback);
  } catch(e){ fallback(); }
});
function updateHi(){ $('hiTitle').textContent = 'HI-SCORE ' + pad(hi, 6); }

/* ---------- 돌리기 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}
function boot(data){
  if (data && typeof data.hi === 'number' && data.hi > hi) hi = data.hi;
  updateHi(); syncSound(); fit();
  newGame(true);
  try { window.claude?.hot?.snapshot?.(() => ({ hi })); } catch(e){}
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('10px "Press Start 2P"'), document.fonts.load('19px "Do Hyeon"')]).catch(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
