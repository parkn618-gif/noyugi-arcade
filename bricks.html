<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노유기 속담 벽돌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Gowun+Dodum&family=Fredoka:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 오락실 기계 한 대 — 위 간판, 가운데 화면(캔버스가 높이를 꽉 채움), 아래 단추 줄. 한 가지 화면(어두운 브라운관)만 쓴다 */
:root{
  --void:#0B0A1F; --cab:#15133A; --ink:#EEF0FF; --dim:#8C90C8; --line:#2B2A66;
  --pink:#FF4F8B; --lemon:#FFD43B; --mint:#3BE0B4; --cobalt:#5C6CFF;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --f-head:'Do Hyeon','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--f-body); overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px, rgba(92,108,255,.14) 1px, transparent 0); background-size:14px 14px}
#app{height:100%; display:flex; flex-direction:column; align-items:center; padding-inline:16px; box-sizing:border-box}
.marquee{flex:none; display:flex; align-items:baseline; justify-content:center; gap:10px; padding-block:8px 6px}
.marquee b{font-family:var(--f-pixel); font-weight:400; font-size:12px; letter-spacing:.12em; color:var(--lemon);
  text-shadow:0 0 6px rgba(255,212,59,.6), 2px 2px 0 var(--pink)}
.marquee span{font-family:var(--f-head); font-size:14px; color:var(--dim)}
#wrap{flex:1; min-height:0; width:100%; display:grid; place-items:center}
#stage{position:relative; border-radius:10px; overflow:hidden; box-shadow:0 0 0 3px var(--line), 0 0 40px rgba(92,108,255,.25);
  touch-action:none; user-select:none; -webkit-user-select:none; background:var(--void)}
#cv{display:block}
#stage::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px),
             radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%)}
.ov{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:24px 18px; text-align:center; background:rgba(11,10,31,.62)}
.eyebrow{font-family:var(--f-head); font-size:16px; color:var(--mint); letter-spacing:.04em}
.logo{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(22px,7.4vw,32px); line-height:1.35; color:var(--lemon);
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--cobalt); text-wrap:balance}
.how{max-width:28ch; margin:0; font-size:15px; line-height:1.7; color:var(--ink)}
.how em{font-style:normal; color:var(--lemon)}
.btn{font-family:var(--f-head); font-size:22px; border:3px solid var(--ink); border-radius:12px; padding:10px 22px 8px;
  background:var(--lemon); color:var(--void); cursor:pointer; box-shadow:0 5px 0 var(--pink)}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:0 5px 0 var(--line); font-size:18px}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--mint); outline-offset:3px}
.coin{font-family:var(--f-pixel); font-size:11px; color:var(--pink); animation:blink 1.1s steps(2) infinite}
.hi{font-family:var(--f-pixel); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.15}}
.big{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:26px; color:var(--pink); text-shadow:3px 3px 0 var(--cobalt)}
.stats{display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:15px; align-items:baseline}
.stats dt{color:var(--dim); text-align:right}
.stats dd{margin:0; text-align:left; font-family:var(--f-pixel); font-size:12px; font-variant-numeric:tabular-nums}
.rec{margin:0; font-family:var(--f-head); font-size:19px; color:var(--mint)}
.row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
#copyBox{width:min(280px,100%); height:76px; font:13px/1.5 var(--f-body); background:var(--cab); color:var(--ink);
  border:2px solid var(--line); border-radius:8px; padding:6px; resize:none}
.msg{min-height:1.4em; font-size:14px; color:var(--mint)}
.bar{flex:none; display:flex; align-items:center; gap:10px; padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));
  width:100%; max-width:480px; justify-content:space-between}
.mini{font-family:var(--f-head); font-size:15px; background:var(--cab); color:var(--ink); border:2px solid var(--line);
  border-radius:9px; padding:5px 12px 3px; cursor:pointer}
.mini[aria-pressed="true"]{color:var(--dim)}
.copy{font-size:12px; color:var(--dim)}
@media (prefers-reduced-motion: reduce){ .coin{animation:none} }
</style>

<div id="app">
  <div class="marquee"><b>NOYUGI ARCADE</b><span>3번 기계</span></div>
  <div id="wrap">
    <div id="stage">

  </div>
</div>

<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stageEl = $('stage'), wrapEl = $('wrap');
const W = 360; let H = 640, scale = 1, dpr = 1;
const FP = '"Press Start 2P", monospace', FK = '"Do Hyeon", sans-serif', FB = '"Gowun Dodum", sans-serif', FE = 'Fredoka, "Do Hyeon", sans-serif';
const C = { void:'#0B0A1F', ink:'#EEF0FF', dim:'#8C90C8', line:'#2B2A66', pink:'#FF4F8B', lemon:'#FFD43B', mint:'#3BE0B4', cobalt:'#5C6CFF', letter:'#141433' };
const ROWCOL = [['#FF4F8B', '#B8285E'], ['#3BE0B4', '#1E9C7C'], ['#7D8BFF', '#3F4BC4'], ['#FFD43B', '#C79A00']];

/* ---------- 공용 파일(없어도 게임은 돈다) ---------- */
const NYGX = window.NYG || null;
const VOC = window.NYGVocab || { next: () => ['bounce back', '다시 회복하다'], speak: c => { c.spoken = true; }, stop: () => {} };
const RAR = (NYGX && NYGX.rare) || { N:{ label:'노말', tint:'#E8ECFC', cap:'#8ED1FC' }, R:{ label:'레어', tint:'#DCF7EE', cap:'#5EDCB8' },
  SR:{ label:'슈퍼레어', tint:'#F1E4FF', cap:'#B98CFF' }, SSR:{ label:'전설', tint:'#FFF1C4', cap:'#FFC93C' } };
const IMG = {};

/* ---------- 저장(이 기기에만) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let hi = store.get('nyg-brick-hi', 0);
let muted = store.get('nyg-brick-muted', false);
let audioOn = false;

/* ---------- 소리 ---------- */
let AC = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay){
  if (muted || !audioOn) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
let noiseBuf = null;
function noise(d, v){
  if (muted || !audioOn) return; const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .6, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d);
}
const sfx = {
  brick(r){ tone(440 + (r % 8) * 55, .05, 'square', .022); },
  hard(){ tone(210, .07, 'square', .03, 150); },
  crack(){ tone(300, .06, 'triangle', .035, 220); },
  word(){ tone(784, .07, 'square', .04); tone(1175, .12, 'square', .04, null, .06); },
  pad(){ tone(320, .06, 'triangle', .04, 210); },
  wall(){ tone(190, .03, 'square', .012); },
  drop(){ tone(700, .09, 'sine', .035, 1250); },
  get(r){ const base = { N:523, R:587, SR:659, SSR:784 }[r] || 523; const n = r === 'SSR' ? 5 : r === 'SR' ? 4 : 3;
    for (let i = 0; i < n; i++) tone(base * Math.pow(1.26, i), .1, 'triangle', .06, null, i * .06); },
  boom(){ noise(.22, .09); },
  save(){ tone(660, .12, 'triangle', .06, 990); },
  coin(){ tone(988, .07, 'square', .05); tone(1319, .28, 'square', .05, null, .07); },
  up(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .09, 'triangle', .07, null, i * .06)); },
  stage(){ [392, 523, 659].forEach((f, i) => tone(f, .12, 'triangle', .06, null, i * .1)); },
  clear(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .13, 'square', .05, null, i * .08)); },
  lose(){ tone(320, .55, 'sawtooth', .07, 50); noise(.5, .14); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .28, 'triangle', .08, null, i * .24)); }
};

/* ---------- 도트 그림 ---------- */
function sprite(rows, pal){
  const h = rows.length, w = rows[0].length, c = document.createElement('canvas');
  c.width = w; c.height = h; const x = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) { const k = rows[y][i]; if (pal[k]) { x.fillStyle = pal[k]; x.fillRect(i, y, 1, 1); } }
  return c;
}
const HEART = sprite(['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r:'#FF4F8B' });

/* ---------- 속담 · 벽돌 모양 (우리가 만든 것) ---------- */
// 옛 속담 · 격언만(저작권 없음). [영어, 한국어 뜻]
const PROVERBS = [
  ['Practice makes perfect.', '연습이 완벽을 만든다.'],
  ['Every cloud has a silver lining.', '모든 구름 뒤에는 은빛 테두리가 있다. 힘든 일 뒤에는 희망이 있다.'],
  ['A friend in need is a friend indeed.', '어려울 때 돕는 친구가 진짜 친구다.'],
  ['Actions speak louder than words.', '말보다 행동이 더 크게 말한다.'],
  ['Better late than never.', '늦더라도 안 하는 것보다 낫다.'],
  ['Slow and steady wins the race.', '느려도 꾸준한 쪽이 경주에서 이긴다.'],
  ["Where there's a will, there's a way.", '뜻이 있는 곳에 길이 있다.'],
  ['The early bird catches the worm.', '일찍 일어나는 새가 벌레를 잡는다.'],
  ['Look before you leap.', '뛰기 전에 먼저 살펴라.'],
  ['Rome was not built in a day.', '로마는 하루아침에 이루어지지 않았다.'],
  ['No pain, no gain.', '고생 없이는 얻는 것도 없다.'],
  ['Time is money.', '시간은 돈이다.'],
  ['Two heads are better than one.', '두 사람의 머리가 한 사람보다 낫다.'],
  ['All that glitters is not gold.', '반짝인다고 다 금은 아니다.'],
  ['Birds of a feather flock together.', '깃털이 같은 새들은 함께 모인다. 끼리끼리 모인다.'],
  ['Haste makes waste.', '서두르면 일을 망친다.'],
  ['Knowledge is power.', '아는 것이 힘이다.'],
  ['Easy come, easy go.', '쉽게 얻은 것은 쉽게 사라진다.'],
  ["Don't count your chickens before they hatch.", '부화하기 전에 병아리를 세지 마라. 김칫국부터 마시지 마라.'],
  ['When in Rome, do as the Romans do.', '로마에서는 로마 사람처럼 행동하라.'],
  ['Out of sight, out of mind.', '눈에서 멀어지면 마음에서도 멀어진다.'],
  ['Honesty is the best policy.', '정직이 최선의 방책이다.'],
  ['Fortune favors the bold.', '행운은 용감한 사람을 돕는다.'],
  ['The pen is mightier than the sword.', '펜은 칼보다 강하다.'],
  ["Don't judge a book by its cover.", '표지만 보고 책을 판단하지 마라.'],
  ['Well begun is half done.', '시작이 반이다.'],
  ['A rolling stone gathers no moss.', '구르는 돌에는 이끼가 끼지 않는다.'],
  ['Many hands make light work.', '손이 많으면 일이 가벼워진다.'],
  ['Laughter is the best medicine.', '웃음이 최고의 약이다.'],
  ['Seeing is believing.', '보는 것이 믿는 것이다.'],
  ['Failure is the mother of success.', '실패는 성공의 어머니다.'],
  ['Great oaks from little acorns grow.', '큰 참나무도 작은 도토리에서 자란다.'],
  ['Strike while the iron is hot.', '쇠는 뜨거울 때 쳐라.']
];
const COLS = 11, CW = 31, CH = 21, GX = (W - COLS * CW) / 2, BY0 = 84, TOPY = 66, BR = 8;
// 모양: 11칸 폭, '#' 가 벽돌
const SHAPES = [
  { name:'하트', rows:['..##...##..', '.####.####.', '###########', '###########', '.#########.', '..#######..', '...#####...', '....###....', '.....#.....'] },
  { name:'별', rows:['.....#.....', '....###....', '###########', '.#########.', '..#######..', '...#####...', '..###.###..', '.###...###.', '.##.....##.'] },
  { name:'연필', rows:['.....#.....', '....###....', '...#####...', '...#####...', '...#####...', '...#####...', '...#####...', '...#####...', '...#####...', '...#####...'] },
  { name:'다이아몬드', rows:['.....#.....', '....###....', '...#####...', '..#######..', '.#########.', '..#######..', '...#####...', '....###....', '.....#.....'] },
  { name:'집', rows:['.....#.....', '....###....', '...#####...', '..#######..', '.#########.', '###########', '.####.####.', '.####.####.', '.####.####.'] },
  { name:'나무', rows:['.....#.....', '....###....', '...#####...', '..#######..', '....###....', '...#####...', '..#######..', '.#########.', '....###....'] },
  { name:'계단', rows:['##.........', '####.......', '######.....', '########...', '##########.', '###########'] },
  { name:'웃는 얼굴', rows:['..#######..', '.#########.', '###.###.###', '###########', '###########', '##.#####.##', '.###...###.', '..#######..'] },
  { name:'십자', rows:['....###....', '....###....', '....###....', '###########', '###########', '###########', '....###....', '....###....', '....###....'] },
  { name:'액자', rows:['###########', '###########', '##.......##', '##.......##', '##.......##', '##.......##', '###########', '###########'] }
];
function randomMask(){
  const R = 6 + Math.floor(Math.random() * 4), rows = [];
  for (let r = 0; r < R; r++) {
    const half = []; for (let c = 0; c < 6; c++) half.push(Math.random() < (r === 0 ? .6 : .78));
    let full = []; for (let c = 0; c < COLS; c++) full.push(half[c <= 5 ? c : 10 - c]);
    if (full.filter(Boolean).length < 5) full = full.map((_, c) => c >= 3 && c <= 7);
    rows.push(full.map(f => f ? '#' : '.').join(''));
  }
  return { name:'무작위', rows };
}
// 낱말 벽돌 자리: 글자 수가 긴 낱말은 3칸, 그 밖에는 2칸. 모양 안에 다 들어가지 않으면 null
function placeWords(rows, words){
  const R = rows.length;
  for (let attempt = 0; attempt < 400; attempt++) {
    const occ = rows.map(() => Array(COLS).fill(false)), cnt = Array(R).fill(0), out = []; let ok = true;
    for (let wi = 0; wi < words.length && ok; wi++) {
      const spans = words[wi].length >= 8 ? [3, 2] : [2];
      const order = [...Array(R).keys()].map(r => [r, cnt[r] + Math.random() * .9]).sort((a, b) => a[1] - b[1]).map(a => a[0]);
      let placed = false;
      outer: for (const r of order) {
        if (cnt[r] >= 3) continue;
        for (const sp of spans) {
          const starts = [];
          for (let c = 0; c + sp <= COLS; c++) { let f = true; for (let k = 0; k < sp; k++) if (rows[r][c + k] !== '#' || occ[r][c + k]) { f = false; break; } if (f) starts.push(c); }
          if (starts.length) { const c = starts[Math.floor(Math.random() * starts.length)]; for (let k = 0; k < sp; k++) occ[r][c + k] = true; cnt[r]++; out.push({ r, c, span: sp }); placed = true; break outer; }
        }
      }
      if (!placed) ok = false;
    }
    if (ok) { out.sort((a, b) => a.r - b.r || a.c - b.c); out.forEach((o, i) => { o.wi = i; }); return out; }
  }
  return null;
}
// 단계 하나: 속담 · 모양 · 벽돌. 단단한 벽돌은 단계가 오를수록 늘어난다.
function buildBricks(stage, rows, words){
  const spots = placeWords(rows, words); if (!spots) return null;
  const startAt = {}, covered = {};
  for (const s of spots) { startAt[s.r + ',' + s.c] = s; for (let k = 0; k < s.span; k++) covered[s.r + ',' + (s.c + k)] = true; }
  const bricks = [];
  rows.forEach((row, r) => { for (let c = 0; c < COLS; c++) {
    if (row[c] !== '#') continue;
    const key = r + ',' + c, s = startAt[key];
    if (s) bricks.push({ r, c, span: s.span, x: GX + c * CW, y: BY0 + r * (CH + 1), w: s.span * CW, h: CH, hp: 1, maxHp: 1, word: words[s.wi], wi: s.wi, dead: false, flash: 0 });
    else if (!covered[key]) bricks.push({ r, c, span: 1, x: GX + c * CW, y: BY0 + r * (CH + 1), w: CW, h: CH, hp: 1, maxHp: 1, word: null, wi: -1, dead: false, flash: 0 });

  const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); msg.textContent = '글자를 길게 눌러 복사해 주세요'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = '복사했어요. 카페 인증 글에 붙여 넣으세요'; }, fallback);
  } catch(e){ fallback(); }
});
function updateHi(){ $('hiTitle').textContent = 'HI-SCORE ' + pad(hi, 6); }

/* ---------- 돌리기 ---------- */
function frame(now){
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}
function boot(data){
  if (data && typeof data.hi === 'number' && data.hi > hi) hi = data.hi;
  updateHi(); syncSound(); fit();
  if (NYGX && NYGX.image) FXIDS.forEach(id => { const c = NYGX.byId(id); if (c) NYGX.image(c, 64).then(i => { IMG[id] = i; }).catch(() => {}); });
  newGame(true);
  try { window.claude?.hot?.snapshot?.(() => ({ hi })); } catch(e){}
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('10px "Press Start 2P"'), document.fonts.load('19px "Do Hyeon"'), document.fonts.load('600 12px Fredoka')]).catch(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}
if (window.__NYG_TEST) window.__NYG_TEST = { PROVERBS, SHAPES, COLS, placeWords, makeStage, randomMask, FX, FXIDS, rollCapsule,
  get G(){ return G; }, get state(){ return state; }, setState(s){ state = s; }, newGame, update, start, catchCapsule, finishStage, ballSpeed, keys, launchAll, hitBrick, fit, setMuted(v){ muted = v; } };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
