<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노유기 알파 스톰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 오락실 기계 한 대 — 위 간판, 가운데 화면(캔버스가 높이를 꽉 채움), 아래 단추 줄. 한 가지 화면(어두운 브라운관)만 쓴다 */
:root{
  --void:#0B0A1F; --cab:#15133A; --ink:#EEF0FF; --dim:#8C90C8; --line:#2B2A66;
  --pink:#FF4F8B; --lemon:#FFD43B; --mint:#3BE0B4; --cobalt:#5C6CFF;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --f-head:'Do Hyeon','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--f-body); overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px, rgba(92,108,255,.14) 1px, transparent 0); background-size:14px 14px}
#app{height:100%; display:flex; flex-direction:column; align-items:center; padding-inline:16px; box-sizing:border-box}
.marquee{flex:none; display:flex; align-items:baseline; justify-content:center; gap:10px; padding-block:8px 6px}
.marquee b{font-family:var(--f-pixel); font-weight:400; font-size:12px; letter-spacing:.12em; color:var(--lemon);
  text-shadow:0 0 6px rgba(255,212,59,.6), 2px 2px 0 var(--pink)}
.marquee span{font-family:var(--f-head); font-size:14px; color:var(--dim)}
#wrap{flex:1; min-height:0; width:100%; display:grid; place-items:center}
#stage{position:relative; border-radius:10px; overflow:hidden; box-shadow:0 0 0 3px var(--line), 0 0 40px rgba(92,108,255,.25);
  touch-action:none; user-select:none; -webkit-user-select:none; background:var(--void)}
#cv{display:block}
#stage::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.18) 2px 3px),
             radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.45) 100%)}
.ov{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:24px 18px; text-align:center; background:rgba(11,10,31,.62)}
.eyebrow{font-family:var(--f-head); font-size:16px; color:var(--mint); letter-spacing:.04em}
.logo{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(24px,8vw,34px); line-height:1.35; color:var(--lemon);
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--cobalt); text-wrap:balance}
.how{max-width:28ch; margin:0; font-size:15px; line-height:1.7; color:var(--ink)}
.how em{font-style:normal; color:var(--lemon)}
.btn{font-family:var(--f-head); font-size:22px; border:3px solid var(--ink); border-radius:12px; padding:10px 22px 8px;
  background:var(--lemon); color:var(--void); cursor:pointer; box-shadow:0 5px 0 var(--pink)}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:0 5px 0 var(--line); font-size:18px}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--mint); outline-offset:3px}
.coin{font-family:var(--f-pixel); font-size:11px; color:var(--pink); animation:blink 1.1s steps(2) infinite}
.hi{font-family:var(--f-pixel); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.15}}
.big{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:26px; color:var(--pink); text-shadow:3px 3px 0 var(--cobalt)}
.stats{display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:15px; align-items:baseline}
.stats dt{color:var(--dim); text-align:right}
.stats dd{margin:0; text-align:left; font-family:var(--f-pixel); font-size:12px; font-variant-numeric:tabular-nums}
.words{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:300px}
.words span{font-family:var(--f-pixel); font-size:10px; padding:5px 7px 4px; border:2px solid var(--mint); color:var(--mint); border-radius:6px}
.words .none{border:0; color:var(--dim); font-family:var(--f-body); font-size:14px}
.row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
#copyBox{width:min(280px,100%); height:76px; font:13px/1.5 var(--f-body); background:var(--cab); color:var(--ink);
  border:2px solid var(--line); border-radius:8px; padding:6px; resize:none}
.msg{min-height:1.4em; font-size:14px; color:var(--mint)}
.bar{flex:none; display:flex; align-items:center; gap:10px; padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));
  width:100%; max-width:480px; justify-content:space-between}
.mini{font-family:var(--f-head); font-size:15px; background:var(--cab); color:var(--ink); border:2px solid var(--line);
  border-radius:9px; padding:5px 12px 3px; cursor:pointer}
.mini[aria-pressed="true"]{color:var(--dim)}
.copy{font-size:12px; color:var(--dim)}
@media (prefers-reduced-motion: reduce){ .coin{animation:none} }
</style>

<div id="app">
  <div class="marquee"><b>NOYUGI ARCADE</b><span>1번 기계</span></div>
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" aria-label="게임 화면"></canvas>

      <div class="ov" id="ovTitle">
        <div class="eyebrow">노유기 오락실 · 단어 슈팅</div>
        <h1 class="logo">ALPHA<br>STORM</h1>
        <p class="how">손가락으로 끌면 연필 비행기가 움직이고, 총알은 저절로 나가요. 위에 뜬 단어의 글자를 맞혀 채우면 <em>3연발</em>이 터져요.</p>
        <button class="btn" id="startBtn" type="button">동전 넣고 시작</button>
        <div class="coin">INSERT COIN</div>
        <div class="hi" id="hiTitle">HI-SCORE 000000</div>
      </div>

      <div class="ov" id="ovPause" hidden>
        <p class="big">PAUSE</p>
        <button class="btn" id="resumeBtn" type="button">계속하기</button>
      </div>

      <div class="ov" id="ovOver" hidden>
        <p class="big">GAME OVER</p>
        <dl class="stats">
          <dt>점수</dt><dd id="stScore">0</dd>
          <dt>최고 점수</dt><dd id="stHi">0</dd>
          <dt>스테이지</dt><dd id="stStage">1</dd>
        </dl>
        <div class="words" id="stWords"></div>
        <div class="row">
          <button class="btn" id="againBtn" type="button">다시 하기</button>
          <button class="btn ghost" id="copyBtn" type="button">인증 문구 복사</button>
        </div>
        <textarea id="copyBox" readonly hidden aria-label="인증 문구"></textarea>
        <div class="msg" id="copyMsg" role="status"></div>
      </div>
    </div>
  </div>
  <div class="bar">
    <button class="mini" id="soundBtn" type="button" aria-pressed="false">소리 켬</button>
    <span class="copy">© 2026 노유기</span>
    <button class="mini" id="pauseBtn" type="button">일시정지</button>
  </div>
</div>

<script src="vocab.js"></script>
<script src="verify.js"></script>
<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stageEl = $('stage'), wrapEl = $('wrap');
const W = 360; let H = 640, scale = 1, dpr = 1;
const FP = '"Press Start 2P", monospace', FK = '"Do Hyeon", sans-serif';
const C = { void:'#0B0A1F', ink:'#EEF0FF', dim:'#8C90C8', line:'#2B2A66', pink:'#FF4F8B', lemon:'#FFD43B', mint:'#3BE0B4', cobalt:'#5C6CFF', letter:'#141433' };

/* ---------- 저장(이 기기에만) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let hi = store.get('nyg-alpha-hi', 0);
let muted = store.get('nyg-alpha-muted', false);

/* ---------- 소리 ---------- */
let AC = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay){
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
let noiseBuf = null;
function noise(d, v){
  if (muted) return; const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .6, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d);
}
const sfx = {
  shot(){ tone(1200, .05, 'square', .012, 600); },
  boom(){ noise(.22, .09); },
  get(){ tone(660, .07, 'square', .045); tone(990, .1, 'square', .045, null, .06); },
  word(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .13, 'square', .05, null, i * .08)); },
  hurt(){ tone(320, .55, 'sawtooth', .07, 50); noise(.5, .14); },
  coin(){ tone(988, .07, 'square', .05); tone(1319, .28, 'square', .05, null, .07); },
  up(){ [784, 988, 1175, 1568].forEach((f, i) => tone(f, .09, 'triangle', .07, null, i * .06)); },
  wave(){ [392, 523, 659].forEach((f, i) => tone(f, .12, 'triangle', .06, null, i * .1)); },
  warn(){ [0, .3, .6].forEach(d => { tone(880, .14, 'sawtooth', .05, 440, d); tone(660, .14, 'sawtooth', .05, 330, d + .15); }); },
  bossHit(){ tone(180 + Math.random() * 60, .04, 'square', .03); },
  bossDie(){ noise(1.2, .2); [523, 392, 330, 262, 196, 131].forEach((f, i) => tone(f, .18, 'square', .06, null, i * .12)); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .28, 'triangle', .08, null, i * .24)); }
};

/* ---------- 도트 그림 ---------- */
function sprite(rows, pal){
  const h = rows.length, w = rows[0].length, c = document.createElement('canvas');
  c.width = w; c.height = h; const x = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) { const k = rows[y][i]; if (pal[k]) { x.fillStyle = pal[k]; x.fillRect(i, y, 1, 1); } }
  return c;
}
// 연필 비행기 — 연필심 · 나무 · 노란 몸통 · 분홍 날개 · 은색 띠 · 지우개
const PENCIL = sprite([
  '.....k.....',
  '....kkk....',
  '....www....',
  '...wwwww...',
  '...yyyyy...',
  '...yoyoy...',
  '...yyyyy...',
  '...yoyoy...',
  '..ryyyyyr..',
  '.rryoyoyrr.',
  'rrryyyyyrrr',
  'rr.sssss.rr',
  'r..ppppp..r',
  '...ppppp...'
], { k:'#B9BEE6', w:'#F2C38B', y:'#FFD43B', o:'#E0A100', r:'#FF4F8B', s:'#C9CEE8', p:'#FF9DBB' });
// 글자 해파리 — 둥근 머리에 글자를 싣고 온다
const JELLY_ROWS = [[
  '....xxxxxx....',
  '..xhhxxxxxxx..',
  '.xhxxxxxxxxxx.',
  'xxxxxxxxxxxxxx',
  'xxxxxxxxxxxxxx',
  'xxxxxxxxxxxxxx',
  'xxxxxxxxxxxxxx',
  '.xxxxxxxxxxxx.',
  'dddeddddddeddd',
  '.d.d..dd..d.d.',
  'd...d....d...d',
  '..............'
], [
  '....xxxxxx....',
  '..xhhxxxxxxx..',
  '.xhxxxxxxxxxx.',
  'xxxxxxxxxxxxxx',
  'xxxxxxxxxxxxxx',
  'xxxxxxxxxxxxxx',
  'xxxxxxxxxxxxxx',
  '.xxxxxxxxxxxx.',
  'dddeddddddeddd',
  '..d.d.dd.d.d..',
  '.d..d....d..d.',
  '..............'
]];
const ROWCOL = [['#FF4F8B', '#B8285E'], ['#3BE0B4', '#1E9C7C'], ['#7D8BFF', '#3F4BC4'], ['#FFD43B', '#C79A00']];
// 머리 모양 세 가지: 둥근 머리 · 뿔 · 더듬이
const TOPS = [null, ['x...xxxxxx...x', '.xxhhxxxxxxxx.'], ['.h..xxxxxx..h.', '..xhhxxxxxxx..']];
const JELLY = TOPS.map(top => ROWCOL.map(([b, d]) => JELLY_ROWS.map(r => sprite(top ? [top[0], top[1], ...r.slice(2)] : r, { x:b, h:'#FFFFFF', d:d, e:'#FFFFFF' }))));
// 대왕 — 뿔 달린 큰 해파리, 빨갛게 빛나는 눈
const BOSS_TOP = [
  'h....................h',
  'hh.....xxxxxxxx.....hh',
  '.hh..xxxxxxxxxxxx..hh.',
  '..hhxxxxxxxxxxxxxxhh..',
  '...xxxxxxxxxxxxxxxx...',
  '..xxxxxxxxxxxxxxxxxx..',
  '..xxeeexxxxxxxxeeexx..',
  '.xxxxeeeexxxxeeeexxxx.',
  '.xxxxxeEExxxxEEexxxxx.',
  '.xxxxxxxxxxxxxxxxxxxx.',
  '.xxxmmmmmmmmmmmmmmxxx.',
  '.xxxmwmwmwmwmwmwmmxxx.',
  '..xxmmmmmmmmmmmmmmxx..',
  'dddddddddddddddddddddd'
];
const BOSS_LEGS = [[
  '.d..d..d..dd..d..d..d.',
  'd..d..d...dd...d..d..d',
  '..d..d.....d....d..d..'
], [
  '..d..d..d.dd.d..d..d..',
  '.d..d..d..dd..d..d..d.',
  'd...d...d.dd.d...d...d'
]];
const BOSS_PAL = { x:'#8E1B45', h:'#EDE6D2', e:'#1A0612', E:'#FF3B3B', m:'#2A0712', w:'#FFFFFF', d:'#4A0B22' };
const BOSS_WPAL = Object.fromEntries(Object.keys(BOSS_PAL).map(k => [k, '#FFFFFF']));
const BOSS = BOSS_LEGS.map(l => sprite(BOSS_TOP.concat(l), BOSS_PAL));
const BOSS_W = BOSS_LEGS.map(l => sprite(BOSS_TOP.concat(l), BOSS_WPAL));
// 대왕이 부서질 때 남기는 투정 한마디
const RANTS = ['영어 실어!!!', '공부하기 싫어!!!', '숙제 언제 끝나…', '단어 외우기 싫다고!!!', '시험 없는 나라로 갈래!!!', '5분만 더 잘래…',
  '수행평가 또 있어?!', '문법 너무 어려워!!!', '학원 가기 싫어!!!', '오늘만 쉬면 안 돼?', '듣기평가 너무 빨라!!!', 'to부정사가 뭔데!!!',
  '관계대명사 왜 있는 건데!!!', '가정법 나한테 왜 그래…', '주말 돌려줘!!!', '방학 언제 와…', '모의고사 또 봐?!', '빈칸 추론 무서워!!!',
  '단어장 어디 갔지…', '내일부터 할게…'];
const HEART = sprite(['.rr.rr.', 'rrrrrrr', 'rrrrrrr', '.rrrrr.', '..rrr..', '...r...'], { r:'#FF4F8B' });

/* ---------- 단어 ---------- */
const WORDS = {
  3: [['SUN','해'],['SKY','하늘'],['JOY','기쁨'],['WOW','와!'],['FUN','재미'],['ACE','에이스'],['ZAP','찌릿'],['POP','펑'],['YES','좋아'],['WIN','승리'],['GEM','보석'],['OWL','부엉이'],['FOX','여우'],['BEE','꿀벌'],['ICE','얼음'],['MAP','지도'],['KEY','열쇠'],['CUP','컵']],
  4: [['STAR','별'],['MOON','달'],['HERO','영웅'],['COOL','멋져'],['EPIC','대단해'],['LUCK','행운'],['GLOW','반짝임'],['ZOOM','슝'],['JUMP','점프'],['WAVE','파도'],['FIRE','불꽃'],['GOLD','금'],['NOVA','새로 빛나는 별'],['BEAM','광선'],['KING','왕'],['WISH','소원'],['HOPE','희망'],['SNOW','눈']],
  5: [['BLAST','폭발'],['LASER','레이저'],['COMET','혜성'],['ORBIT','궤도'],['POWER','힘'],['SUPER','최고'],['MAGIC','마법'],['BRAVE','용감한'],['HAPPY','행복한'],['LUCKY','운 좋은'],['SHINE','빛나다'],['SPACE','우주'],['ALIEN','외계인'],['SPARK','불꽃'],['DREAM','꿈'],['PEACE','평화'],['TIGER','호랑이'],['CANDY','사탕']],
  6: [['ROCKET','로켓'],['GALAXY','은하'],['PLANET','행성'],['LEGEND','전설'],['WINNER','승자'],['BRIGHT','밝은'],['COSMIC','우주의'],['METEOR','유성'],['SHIELD','방패'],['DRAGON','용'],['SPIRIT','기세'],['FOREST','숲']]
};
const FILL = 'ABCDEFGHIJKLMNOPRSTUVWY';
// 적군 이름 — 문법 용어와 그 약자
const SPECIES = ['주어 S', '동사 V', '목적어 O', '보어 C', 'to부정사', '동명사', 'V-ing', 'p.p.', '관계사', '분사구문', '가정법', '수동태', '현재완료', '도치', '강조구문', 'that절', '가주어 it', '접속사', '전치사', 'what절'];
// 공용 파일을 못 불러와도 게임은 돈다
const nextVocab = () => window.NYGVocab ? NYGVocab.next() : ['bounce back', '다시 회복하다'];
const speakCard = c => { if (window.NYGVocab) NYGVocab.speak(c, muted); else c.spoken = true; };
const stopSpeech = () => { if (window.NYGVocab) NYGVocab.stop(); };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function wordLen(st){ return st === 1 ? 3 : st === 2 ? 4 : st === 3 ? pick([4, 5]) : st === 4 ? 5 : pick([5, 6]); }

/* ---------- 상태 ---------- */
let state = 'title', G = null, ship, enemies = [], bullets = [], ebullets = [], parts = [], floaters = [], banners = [], pops = [];
const stars = Array.from({ length: 70 }, () => ({ x: rnd(0, W), y: rnd(0, 800), z: pick([1, 1, 1, 2, 2, 3]) }));
const COLS = 6, GAPX = 46, GAPY = 41, TOPY = 90;

function newGame(){
  G = { score:0, lives:3, stage:0, words:[], recent:[], t:0, fx:0, diveT:3, fireT:1, wordWait:0, waveWait:0, shake:0, flash:0, triple:0, overT:0, wordsForLife:0, sp:0, card:null, rings:[], wflash:0 };
  ship = { x: W / 2, dead: 0, inv: 2, cool: .4 };
  bullets = []; ebullets = []; parts = []; floaters = []; banners = []; pops = [];
  nextWave();
}
function slotX(c){ return W / 2 + (c - (COLS - 1) / 2) * GAPX + G.fx; }
function slotY(r){ return TOPY + r * GAPY; }
function nextWave(){
  G.stage++; G.boss = null; G.bossDone = false; G.rant = null;
  const rows = G.stage === 1 ? 3 : 4;
  const names = [], shapes = [];
  for (let r = 0; r < rows; r++) { const k = (G.sp + r) % SPECIES.length; names[r] = SPECIES[k]; shapes[r] = k % 3; }
  G.sp += rows;
  enemies = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < COLS; c++) {
    const side = c < COLS / 2 ? -1 : 1;
    enemies.push({ r, c, name: names[r], shape: shapes[r], ch: pick(FILL), alive: true, st: 'enter', delay: .25 + (r * COLS + (side < 0 ? c : COLS - 1 - c)) * .05,
      t: 0, x: W / 2 + side * 220, y: -30 - r * 12, sx: W / 2 + side * 220, sy: -30 - r * 12, side, flip: 0, hit: 0, anim: Math.random() });
  }
  G.word = null; pickWord(true);
  G.diveT = 3.2; G.fireT = 1.5;

  ctx.drawImage(img, X, Y, w, h);

  if (b.hit > 0) { ctx.globalAlpha = .75; ctx.drawImage(BOSS_W[fr], X, Y, w, h); ctx.globalAlpha = 1; }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '14px ' + FK;
  const tw = ctx.measureText(b.name).width + 12;
  ctx.fillStyle = 'rgba(11,10,31,.85)'; ctx.fillRect(Math.round(b.x - tw / 2), Y + h + 2, Math.round(tw), 18);
  ctx.fillStyle = '#FF3B3B'; ctx.fillText(b.name, Math.round(b.x), Y + h + 11.5);
}
function drawRant(){
  const r = G.rant; if (!r || r.t < .5) return;
  const a = Math.min(1, (r.t - .5) / .2), sc = 1 + Math.max(0, .35 - (r.t - .5)) * 1.6, wob = RM ? 0 : Math.sin(r.t * 18) * 1.5;
  const y0 = Math.round(H * .42);
  ctx.save(); ctx.globalAlpha = a;
  // 말풍선
  const bw = W - 36, bh = 96, bx = 18, by = y0 - 52;
  ctx.fillStyle = 'rgba(11,10,31,.9)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#FF3B3B'; ctx.lineWidth = 3; ctx.strokeRect(bx + 1.5, by + 1.5, bw - 3, bh - 3);
  ctx.fillStyle = 'rgba(11,10,31,.9)'; ctx.beginPath(); ctx.moveTo(W / 2 - 12, by + 1); ctx.lineTo(W / 2, by - 16); ctx.lineTo(W / 2 + 12, by + 1); ctx.fill();
  ctx.strokeStyle = '#FF3B3B'; ctx.beginPath(); ctx.moveTo(W / 2 - 12, by + 1.5); ctx.lineTo(W / 2, by - 16); ctx.lineTo(W / 2 + 12, by + 1.5); ctx.stroke();
  ctx.translate(W / 2, y0); ctx.scale(sc, sc);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '12px ' + FP; ctx.fillStyle = C.lemon; ctx.fillText('+' + r.score.toLocaleString('ko-KR'), 0, -30);
  ctx.font = '32px ' + FK;
  ctx.fillStyle = C.cobalt; ctx.fillText(r.text, 3 + wob, 5, bw - 24);
  ctx.fillStyle = C.pink; ctx.fillText(r.text, 1.5 + wob, 3.5, bw - 24);
  ctx.fillStyle = '#FFFFFF'; ctx.fillText(r.text, wob, 2, bw - 24);
  ctx.font = '14px ' + FK; ctx.fillStyle = C.dim; ctx.fillText(r.name + '의 마지막 한마디', 0, 32);
  ctx.restore();
  if (r.t > 2.5) { ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '13px ' + FK; ctx.fillStyle = C.dim; ctx.fillText('화면을 누르면 계속', W / 2, y0 + 64); }
}
function drawCard(){
  const c = G.card; if (!c || c.t < .3) return;
  const a = Math.max(0, Math.min(1, (c.t - .3) / .15));
  const w = 304, h = 78, x = (W - w) / 2, y = Math.round(H * .6);
  ctx.save(); ctx.globalAlpha = a;
  ctx.fillStyle = 'rgba(11,10,31,.92)'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = C.lemon; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.fillStyle = C.pink; ctx.fillRect(x + 6, y + 6, 4, 4); ctx.fillRect(x + w - 10, y + 6, 4, 4); ctx.fillRect(x + 6, y + h - 10, 4, 4); ctx.fillRect(x + w - 10, y + h - 10, 4, 4);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '23px ' + FK; ctx.fillStyle = C.lemon; ctx.fillText(c.en, W / 2, y + 28, w - 24);
  ctx.font = '16px "Gowun Dodum", sans-serif'; ctx.fillStyle = C.ink; ctx.fillText(c.ko, W / 2, y + 56, w - 24);
  if (c.t > 1.5) { ctx.font = '13px ' + FK; ctx.fillStyle = C.dim; ctx.fillText(G.lives > 0 ? '화면을 누르면 계속' : '화면을 누르면 결과 보기', W / 2, y + h + 16); }
  ctx.restore();
}
function drawJelly(x, y, row, anim, ch, needed, flip, shape, name){
  const fr = Math.floor(anim * 3) % 2, img = JELLY[shape || 0][row][fr];
  const X = Math.round(x) - 14, Y = Math.round(y) - 12;
  if (needed) { ctx.globalAlpha = .55 + .35 * Math.sin(anim * 6); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(X - 2, Y - 2, 32, 2); ctx.fillRect(X - 2, Y + 16, 2, 2); ctx.fillRect(X + 28, Y + 16, 2, 2); ctx.globalAlpha = 1;
    // 반짝이 별
    const sx = Math.round(x + Math.cos(anim * 3) * 18), sy = Math.round(y - 14 + Math.sin(anim * 3) * 4);
    ctx.fillStyle = C.lemon; ctx.fillRect(sx - 1, sy - 3, 2, 6); ctx.fillRect(sx - 3, sy - 1, 6, 2); }
  ctx.drawImage(img, X, Y, 28, 24);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '10px ' + FP;
  ctx.fillStyle = flip > 0 && Math.floor(flip * 16) % 2 ? '#FFFFFF' : C.letter;
  ctx.fillText(ch, Math.round(x) + 1, Y + 9);
  if (name) {
    ctx.font = '10px ' + FK; const tw = ctx.measureText(name).width + 6;
    ctx.fillStyle = 'rgba(11,10,31,.8)'; ctx.fillRect(Math.round(x - tw / 2), Y + 25, Math.round(tw), 13);
    ctx.fillStyle = ROWCOL[row][0]; ctx.fillText(name, Math.round(x), Y + 32);
  }
}
function drawHud(){
  ctx.textBaseline = 'top'; ctx.font = '8px ' + FP;
  ctx.textAlign = 'left'; ctx.fillStyle = C.pink; ctx.fillText('SCORE', 10, 8);
  ctx.fillStyle = C.ink; ctx.fillText(pad(G.score, 6), 10, 18);
  ctx.textAlign = 'right'; ctx.fillStyle = C.pink; ctx.fillText('HI', W - 10, 8);
  ctx.fillStyle = C.ink; ctx.fillText(pad(Math.max(hi, G.score), 6), W - 10, 18);
  const w = G.word;
  if (G.boss) {
    const b = G.boss, bw = 200, x = W / 2 - bw / 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '13px ' + FK; ctx.fillStyle = '#FF3B3B';
    ctx.fillText(b.name, W / 2, 32);
    ctx.fillStyle = C.line; ctx.fillRect(x, 42, bw, 8);
    ctx.fillStyle = '#FF3B3B'; ctx.fillRect(x + 1, 43, (bw - 2) * Math.max(0, b.hp / b.max), 6);
  } else if (w) {
    const len = w.w.length;
    for (let i = 0; i < len; i++) {
      const s = hudSlot(i, len);
      ctx.strokeStyle = w.got[i] === 2 ? C.lemon : C.line; ctx.lineWidth = 2;
      ctx.strokeRect(s.x + 1, s.y + 1, s.size - 2, s.size - 2);
      if (w.got[i] === 2) { ctx.fillStyle = 'rgba(255,212,59,.18)'; ctx.fillRect(s.x + 2, s.y + 2, s.size - 4, s.size - 4); }
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '10px ' + FP;
      ctx.fillStyle = w.got[i] === 2 ? C.lemon : 'rgba(140,144,200,.45)';
      ctx.fillText(w.w[i], s.x + s.size / 2 + 1, s.y + s.size / 2 + 1);
    }
  } else if (G.waveWait <= 0 && !G.rant) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '8px ' + FP; ctx.fillStyle = C.dim;
    ctx.fillText(G.wordWait > 0 ? 'NEXT WORD' : 'CLEAR THE WAVE', W / 2, 41);
  }
  // 아래: 목숨 · 스테이지 · 3연발 남은 시간
  for (let i = 0; i < G.lives; i++) ctx.drawImage(HEART, 10 + i * 18, H - 22, 14, 12);
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle'; ctx.font = '8px ' + FP; ctx.fillStyle = C.mint;
  ctx.fillText('STAGE ' + G.stage, W - 10, H - 16);
  if (G.triple > 0) { ctx.fillStyle = C.lemon; ctx.fillRect(W / 2 - 40, H - 18, 80 * (G.triple / 8), 4); ctx.strokeStyle = C.line; ctx.lineWidth = 1; ctx.strokeRect(W / 2 - 40.5, H - 18.5, 81, 5); }
}
function drawBanners(){
  const b = banners[banners.length - 1]; if (!b) return;
  const p = b.t / b.life, s = p < .12 ? .6 + p / .12 * .4 : 1, a = p > .8 ? (1 - p) / .2 : 1;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(W / 2, H * .5); ctx.scale(s, s);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = (b.big ? 26 : 18) + 'px ' + FP;
  ctx.fillStyle = C.cobalt; ctx.fillText(b.text, 3, 3);
  ctx.fillStyle = C.pink; ctx.fillText(b.text, 1.5, 1.5);
  ctx.fillStyle = b.color; ctx.fillText(b.text, 0, 0);
  if (b.sub) { ctx.font = '19px ' + FK; ctx.fillStyle = C.ink; ctx.fillText(b.sub, 0, b.big ? 32 : 26); }
  ctx.restore();
}
function drawAttract(){
  const t = performance.now() / 1000, word = 'READY';
  for (let i = 0; i < word.length; i++) {
    const x = W / 2 + (i - 2) * 46, y = 70 + Math.sin(t * 2 + i * .8) * 6;
    const k = (Math.floor(t / 2.5) * word.length + i) % SPECIES.length;
    drawJelly(x, y, i % 4, t + i * .2, word[i], false, 0, k % 3, SPECIES[k]);
  }
  ctx.drawImage(PENCIL, W / 2 - 11, H - 96, 22, 28);
  ctx.fillStyle = Math.floor(t * 20) % 2 ? C.pink : C.lemon; ctx.fillRect(W / 2 - 3, H - 68, 6, 4);
}

/* ---------- 화면 크기 ---------- */
function fit(){
  const r = wrapEl.getBoundingClientRect(), aw = Math.max(200, r.width), ah = Math.max(300, r.height - 4);
  H = Math.round(Math.min(780, Math.max(560, W * ah / aw)));
  scale = Math.min(aw / W, ah / H);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  stageEl.style.width = cw + 'px'; stageEl.style.height = ch + 'px';
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(wrapEl);

/* ---------- 조작 ---------- */
const keys = { left: false, right: false };
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); }
  else if ((e.key === 'Enter' || e.key === ' ') && state === 'play' && G && (G.card || G.rant)) { if (G.card && G.card.t > 1.5) G.card.skip = true; if (G.rant && G.rant.t > 2.5) G.rant.skip = true; e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ') && state === 'title' && document.activeElement === document.body) { start(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  if (G.card) { if (G.card.t > 1.5) G.card.skip = true; return; }
  if (G.rant) { if (G.rant.t > 2.5) G.rant.skip = true; return; }
  const r = cv.getBoundingClientRect();
  drag = { id: e.pointerId, px: e.clientX, sx: ship.x, k: W / r.width };
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id || state !== 'play') return;
  ship.x = Math.max(16, Math.min(W - 16, drag.sx + (e.clientX - drag.px) * drag.k * 1.25));
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);

function start(){
  ac(); sfx.coin();
  $('ovTitle').hidden = true; $('ovOver').hidden = true; $('ovPause').hidden = true;
  newGame(); state = 'play';
}
function togglePause(){
  if (state === 'play') { state = 'paused'; $('ovPause').hidden = false; $('resumeBtn').focus(); }
  else if (state === 'paused') { state = 'play'; $('ovPause').hidden = true; last = performance.now(); }
}
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('resumeBtn').addEventListener('click', togglePause);
$('pauseBtn').addEventListener('click', togglePause);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
function syncSound(){ $('soundBtn').textContent = muted ? '소리 끔' : '소리 켬'; $('soundBtn').setAttribute('aria-pressed', String(muted)); }
$('soundBtn').addEventListener('click', () => { muted = !muted; if (muted) stopSpeech(); store.set('nyg-alpha-muted', muted); syncSound(); if (!muted) { ac(); tone(880, .08, 'square', .04); } });
$('copyBtn').addEventListener('click', () => {
  const text = !window.NYGProof ? '노유기 오락실 · 알파 스톰' + String.fromCharCode(10) + '점수 ' + G.score.toLocaleString('ko-KR') + '점' : NYGProof.text('알파 스톰', G.score, ['STAGE ' + G.stage, '완성한 단어 ' + G.words.length + '개' + (G.words.length ? ': ' + G.words.join(' ') : '')]);
  const box = $('copyBox'), msg = $('copyMsg');
  const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); msg.textContent = '글자를 길게 눌러 복사해 주세요'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = '복사했어요. 카페 인증 글에 붙여 넣으세요'; }, fallback);
  } catch(e){ fallback(); }
});
function updateHi(){ $('hiTitle').textContent = 'HI-SCORE ' + pad(hi, 6); }

/* ---------- 돌리기 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}
function boot(data){
  if (data && typeof data.hi === 'number' && data.hi > hi) hi = data.hi;
  updateHi(); syncSound(); fit();
  try { window.claude?.hot?.snapshot?.(() => ({ hi })); } catch(e){}
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('10px "Press Start 2P"'), document.fonts.load('19px "Do Hyeon"')]).catch(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
