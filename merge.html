<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>노유기 캐릭터 합치기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: 오락실 기계 한 대 — 위 간판, 가운데 화면(캔버스가 높이를 꽉 채움), 아래 단추 줄. 한 가지 화면(밤하늘 아래 유리 캡슐 상자)만 쓴다 */
:root{
  --void:#0B0A1F; --cab:#15133A; --ink:#EEF0FF; --dim:#8C90C8; --line:#2B2A66;
  --pink:#FF4F8B; --lemon:#FFD43B; --mint:#3BE0B4; --cobalt:#5C6CFF;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --f-head:'Do Hyeon','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--f-body); overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px, rgba(92,108,255,.14) 1px, transparent 0); background-size:14px 14px}
#app{height:100%; display:flex; flex-direction:column; align-items:center; padding-inline:16px; box-sizing:border-box}
.marquee{flex:none; display:flex; align-items:baseline; justify-content:center; gap:10px; padding-block:8px 6px}
.marquee b{font-family:var(--f-pixel); font-weight:400; font-size:12px; letter-spacing:.12em; color:var(--lemon);
  text-shadow:0 0 6px rgba(255,212,59,.6), 2px 2px 0 var(--pink)}
.marquee span{font-family:var(--f-head); font-size:14px; color:var(--dim)}
#wrap{flex:1; min-height:0; width:100%; display:grid; place-items:center}
#stage{position:relative; border-radius:10px; overflow:hidden; box-shadow:0 0 0 3px var(--line), 0 0 40px rgba(92,108,255,.25);
  touch-action:none; user-select:none; -webkit-user-select:none; background:var(--void)}
#cv{display:block}
#stage::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.42) 100%)}
.ov{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:12px; padding:20px 18px; text-align:center; background:rgba(11,10,31,.62)}
.eyebrow{font-family:var(--f-head); font-size:16px; color:var(--mint); letter-spacing:.04em}
.logo{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(22px,7.4vw,32px); line-height:1.35; color:var(--lemon);
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--cobalt); text-wrap:balance}
.how{max-width:29ch; margin:0; font-size:15px; line-height:1.7; color:var(--ink)}
.how em{font-style:normal; color:var(--lemon)}
.btn{font-family:var(--f-head); font-size:22px; border:3px solid var(--ink); border-radius:12px; padding:10px 22px 8px;
  background:var(--lemon); color:var(--void); cursor:pointer; box-shadow:0 5px 0 var(--pink)}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:0 5px 0 var(--line); font-size:18px}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--mint); outline-offset:3px}
.coin{font-family:var(--f-pixel); font-size:11px; color:var(--pink); animation:blink 1.1s steps(2) infinite}
.hi{font-family:var(--f-pixel); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.15}}
.big{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:26px; color:var(--pink); text-shadow:3px 3px 0 var(--cobalt)}
.stats{display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:15px; align-items:baseline; margin:0}
.stats dt{color:var(--dim); text-align:right}
.stats dd{margin:0; text-align:left; font-family:var(--f-pixel); font-size:12px; font-variant-numeric:tabular-nums}
.rec{margin:0; font-size:16px; line-height:1.5; color:var(--mint)}
#stImg{width:84px; height:84px; display:block}
.row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}
#copyBox{width:min(280px,100%); height:76px; font:13px/1.5 var(--f-body); background:var(--cab); color:var(--ink);
  border:2px solid var(--line); border-radius:8px; padding:6px; resize:none}
.msg{min-height:1.4em; font-size:14px; color:var(--mint)}
.bar{flex:none; display:flex; align-items:center; gap:10px; padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));
  width:100%; max-width:480px; justify-content:space-between}
.mini{font-family:var(--f-head); font-size:15px; background:var(--cab); color:var(--ink); border:2px solid var(--line);
  border-radius:9px; padding:5px 12px 3px; cursor:pointer}
.mini[aria-pressed="true"]{color:var(--dim)}
.copy{font-size:12px; color:var(--dim)}
@media (prefers-reduced-motion: reduce){ .coin{animation:none} }
</style>
<script src="chars.js"></script>
<script src="vocab.js"></script>
<script src="verify.js"></script>

<div id="app">
  <div class="marquee"><b>NOYUGI ARCADE</b><span>5번 기계</span></div>
  <div id="wrap">
    <div id="stage">
      <canvas id="cv" aria-label="게임 화면"></canvas>

      <div class="ov" id="ovTitle">
        <div class="eyebrow">노유기 오락실 · 캐릭터 합치기</div>
        <h1 class="logo">CAPSULE<br>MERGE</h1>
        <p class="how">손가락으로 좌우를 정하고 떼면 캐릭터가 떨어져요. 같은 캐릭터끼리 닿으면 <em>한 단계 진화</em>! 끝까지 가면 노유기몬이 나와요.</p>
        <button class="btn" id="startBtn" type="button">동전 넣고 시작</button>
        <div class="coin">INSERT COIN</div>
        <div class="hi" id="hiTitle">HI-SCORE 000000</div>
      </div>

      <div class="ov" id="ovPause" hidden>
        <p class="big">PAUSE</p>
        <button class="btn" id="resumeBtn" type="button">계속하기</button>
      </div>

      <div class="ov" id="ovOver" hidden>
        <p class="big">GAME OVER</p>
        <img id="stImg" alt="" width="84" height="84">
        <dl class="stats">
          <dt>점수</dt><dd id="stScore">0</dd>
          <dt>최고 점수</dt><dd id="stHi">0</dd>
        </dl>
        <p class="rec" id="stRec"></p>
        <div class="row">
          <button class="btn" id="againBtn" type="button">다시 하기</button>
          <button class="btn ghost" id="copyBtn" type="button">인증 문구 복사</button>
        </div>
        <textarea id="copyBox" readonly hidden aria-label="인증 문구"></textarea>
        <div class="msg" id="copyMsg" role="status"></div>
      </div>
    </div>
  </div>
  <div class="bar">
    <button class="mini" id="soundBtn" type="button" aria-pressed="false">소리 켬</button>
    <span class="copy">© 2026 노유기</span>
    <button class="mini" id="pauseBtn" type="button">일시정지</button>
  </div>
</div>

<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stageEl = $('stage'), wrapEl = $('wrap');
const W = 360; let H = 640, scale = 1, dpr = 1;
const FP = '"Press Start 2P", monospace', FK = '"Do Hyeon", sans-serif', FB = '"Gowun Dodum", sans-serif';
const C = { void:'#0B0A1F', ink:'#EEF0FF', dim:'#8C90C8', line:'#2B2A66', pink:'#FF4F8B', lemon:'#FFD43B', mint:'#3BE0B4', cobalt:'#5C6CFF' };

/* ---------- 저장(이 기기에만) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let hi = store.get('nyg-merge-hi', 0);
let muted = store.get('nyg-merge-muted', false);

/* ---------- 소리(모두 합성) ---------- */
let AC = null, armed = false;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay){
  if (muted || !armed) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
let noiseBuf = null;
function noise(d, v){
  if (muted || !armed) return; const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .6, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d);
}
const PENT = [262, 294, 330, 392, 440];
const nf = i => PENT[i % 5] * Math.pow(2, Math.floor(i / 5));
const sfx = {
  coin(){ tone(988, .07, 'square', .05); tone(1319, .28, 'square', .05, null, .07); },
  drop(){ tone(240, .08, 'sine', .06, 150); },
  hit(v){ noise(.06, Math.min(.05, v / 9000)); },
  merge(l){ tone(nf(l), .13, 'triangle', .07); tone(nf(l) * 2, .2, 'sine', .035, null, .05); },
  newchar(l){ [1, 1.26, 1.5, 2].forEach((k, i) => tone(nf(l) * k, .12, 'triangle', .06, null, i * .07)); },
  max(){ [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, .16, 'square', .05, null, i * .09)); },
  warn(){ tone(880, .06, 'square', .02); },
  hurt(){ tone(320, .55, 'sawtooth', .07, 50); noise(.5, .14); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .28, 'triangle', .08, null, i * .24)); }
};

/* ---------- 캐릭터 순서(가챠 등급 순, 작은 것부터) ---------- */
const ORDER = ['comma','period','question','exclaim','apos','verb','adj','adv','noun','prep','rabbit','cloud','fox','dragon','unicorn','noyugimon'];
const NL = ORDER.length;                         // 16단계
const CH = ORDER.map(id => (window.NYG && NYG.byId(id)) || { id, r:'N', name:id, en:id, tip:'' });
const CAP = CH.map(c => (window.NYG && NYG.rare && NYG.rare[c.r] && NYG.rare[c.r].cap) || '#8ED1FC');
const SPR = [];                                  // 그림 캔버스(192px) — 불러오는 동안은 색 공으로 대신한다
const SPR_PX = 192;
if (window.NYG) Promise.all(CH.map((c, i) => NYG.image(c, SPR_PX, { bg:true }).then(img => {
  const k = document.createElement('canvas'); k.width = k.height = SPR_PX; k.getContext('2d').drawImage(img, 0, 0, SPR_PX, SPR_PX); SPR[i] = k;
}).catch(() => {})));

/*PHYS-BEGIN*/
/* ---------- 물리: 원 충돌(중력 · 벽 · 반발 · 마찰), 같은 단계끼리 닿으면 합친다 ---------- */
const RAD = Array.from({ length: 16 }, (_, i) => 13 + i * 5);   // 단계별 반지름 13 … 88
const G_ACC = 1500, SUB = 8, ITER = 8;
function mkWorld(l, r, floor){ return { l, r, floor, bodies: [], uid: 1, noMerge: false }; }
function addBody(w, lvl, x, y, vx, vy){
  const b = { id: w.uid++, lvl, r: RAD[lvl], x, y, vx: vx || 0, vy: vy || 0, age: 0, pop: 1 };
  w.bodies.push(b); return b;
}
function stepWorld(w, dt, hk){
  const h = dt / SUB, bs = w.bodies, n = bs.length; let maxHit = 0;
  for (let s = 0; s < SUB; s++) {
    const damp = 1 - .7 * h;
    for (let i = 0; i < n; i++) { const b = bs[i]; b.vy += G_ACC * h; b.vx *= damp; b.vy *= damp; b.x += b.vx * h; b.y += b.vy * h; }
    for (let it = 0; it < ITER; it++) {
      for (let i = 0; i < n; i++) {
        const b = bs[i];
        if (b.x - b.r < w.l) { b.x = w.l + b.r; if (b.vx < 0) { if (-b.vx > maxHit) maxHit = -b.vx; b.vx = 0; } }
        if (b.x + b.r > w.r) { b.x = w.r - b.r; if (b.vx > 0) { if (b.vx > maxHit) maxHit = b.vx; b.vx = 0; } }
        if (b.y + b.r > w.floor) { b.y = w.floor - b.r; if (b.vy > 0) { if (b.vy > maxHit) maxHit = b.vy; b.vy = -b.vy * (b.vy > 320 ? .22 : 0); } b.vx *= .985; }
      }
      for (let i = 0; i < n; i++) {
        const a = bs[i];
        for (let j = i + 1; j < n; j++) {
          const b = bs[j], dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
          if (dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
          const d2 = dx * dx + dy * dy; if (d2 >= rr * rr) continue;
          let d = Math.sqrt(d2), nx, ny;
          if (d < 1e-6) { nx = 0; ny = -1; d = 0; } else { nx = dx / d; ny = dy / d; }
          const ia = 1 / (a.r * a.r), ib = 1 / (b.r * b.r), is = ia + ib, pen = rr - d, corr = pen * .8 / is;
          a.x -= nx * corr * ia; a.y -= ny * corr * ia; b.x += nx * corr * ib; b.y += ny * corr * ib;
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy, rn = rvx * nx + rvy * ny;
          if (rn < 0) {
            if (-rn > maxHit) maxHit = -rn;
            const e = rn < -300 ? .2 : 0, j2 = -(1 + e) * rn / is;
            a.vx -= j2 * ia * nx; a.vy -= j2 * ia * ny; b.vx += j2 * ib * nx; b.vy += j2 * ib * ny;
            const tx = -ny, ty = nx, rt = rvx * tx + rvy * ty, mx = .3 * j2;
            let jt = -rt / is; if (jt > mx) jt = mx; else if (jt < -mx) jt = -mx;
            a.vx -= jt * ia * tx; a.vy -= jt * ia * ty; b.vx += jt * ib * tx; b.vy += jt * ib * ty;
          }
        }
      }
    }
    for (let i = 0; i < n; i++) { const b = bs[i]; if (b.vx * b.vx + b.vy * b.vy < 196) { b.vx = 0; b.vy = 0; } }
  }
  for (let i = 0; i < n; i++) { const b = bs[i]; b.age += dt; if (b.pop < 1) b.pop = Math.min(1, b.pop + dt / .3); }
  if (maxHit > 0 && hk && hk.onHit) hk.onHit(maxHit);
  if (w.noMerge) return;
  // 합치기: 같은 단계 둘이 닿았으면(겹침 + 1.5px 이내)
  const dead = new Set(), born = [];
  for (let i = 0; i < n; i++) {
    const a = bs[i]; if (dead.has(a)) continue;
    for (let j = i + 1; j < n; j++) {
      const b = bs[j]; if (dead.has(b) || b.lvl !== a.lvl) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r + 1.5;
      if (dx * dx + dy * dy > rr * rr) continue;
      dead.add(a); dead.add(b);
      const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
      if (a.lvl >= RAD.length - 1) { if (hk && hk.onMax) hk.onMax(x, y, a, b); }
      else {
        const nb = { id: w.uid++, lvl: a.lvl + 1, r: RAD[a.lvl + 1], x, y, vx: (a.vx + b.vx) / 2, vy: (a.vy + b.vy) / 2, age: 0, pop: 0 };
        born.push(nb); if (hk && hk.onMerge) hk.onMerge(nb, a, b);
      }
      break;
    }
  }
  if (dead.size) { w.bodies = bs.filter(b => !dead.has(b)).concat(born); }
}
/*PHYS-END*/

/* ---------- 화면 배치 ---------- */
const BOX_L = 24, BOX_R = 336, BOX_TOP = 116, LINE_Y = 142, HOLD_Y = 80, RAIL_Y = 46;
const floorY = () => H - 58;
const DANGER_MAX = 3;           // 선 위에 이만큼(초) 머물면 끝
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const pad = (n, l) => String(n).padStart(l, '0');

/* ---------- 상태 ---------- */
let state = 'title', G = null;
let world = mkWorld(BOX_L, BOX_R, 576);
let parts = [], rings = [], pops = [];
let demoT = 0, shootT = 5, shoot = null, tsky = 0;
const stars = Array.from({ length: 80 }, () => ({ x: rnd(0, W), y: rnd(0, 800), z: pick([1, 1, 1, 2, 2, 3]), ph: rnd(0, 6.28) }));

function newGame(){
  world = mkWorld(BOX_L, BOX_R, floorY());
  parts = []; rings = []; pops = [];
  G = { score: 0, merges: 0, best: 0, seen: new Set([0]), cur: Math.floor(rnd(0, 5)), next: Math.floor(rnd(0, 5)), aim: W / 2, cool: .25,
        danger: 0, warnT: 0, t: 0, card: null, shake: 0, flash: 0, wflash: 0, toast: null, combo: 0, comboT: 0, over: false };
  G.seen.add(G.cur);
}
function burst(x, y, color, n, spd){
  for (let i = 0; i < n && parts.length < 420; i++) { const a = rnd(0, Math.PI * 2), s = rnd(30, spd || 150);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 30, life: rnd(.4, .9), t: 0, color, size: pick([2, 3, 3, 4]) }); }
}
function ringFx(x, y, color, r, life){ rings.push({ x, y, t: 0, life: life || .5, r, color }); }
function popText(x, y, text, color){ pops.push({ x, y, text, color, t: 0 }); }

/* ---------- 게임 규칙 ---------- */
function gameHooks(){
  return {
    onHit(v){ if (v > 260 && G && !G.over) sfx.hit(v); },
    onMerge(nb, a, b){
      G.merges++; G.comboT = .9; G.combo = Math.min(5, G.combo + 1);
      const pts = (10 + 4 * nb.lvl * nb.lvl) * G.combo; G.score += pts;
      burst(nb.x, nb.y, CAP[nb.lvl], 14 + nb.lvl, 120 + nb.lvl * 12); ringFx(nb.x, nb.y, CAP[nb.lvl], nb.r * 1.5, .45);
      popText(nb.x, nb.y - nb.r, '+' + pts + (G.combo > 1 ? ' x' + G.combo : ''), G.combo > 1 ? C.lemon : C.ink);
      sfx.merge(nb.lvl);
      if (nb.lvl > G.best) G.best = nb.lvl;
      if (!G.seen.has(nb.lvl)) {
        G.seen.add(nb.lvl); G.toast = { lvl: nb.lvl, t: 0, life: nb.lvl >= NL - 1 ? 4.2 : 3.4 }; sfx.newchar(nb.lvl);
        if (!RM) G.shake = Math.max(G.shake, nb.lvl >= 10 ? .4 : .15);
        if (nb.lvl >= NL - 1) { G.flash = RM ? 0 : .8; for (let k = 0; k < 3; k++) burst(nb.x, nb.y, pick([C.lemon, C.pink, C.mint, C.cobalt]), 26, 260); }
      }
    },
    onMax(x, y){
      G.merges++; G.score += 2000; G.flash = RM ? 0 : .8; sfx.max();
      for (let k = 0; k < 4; k++) burst(x, y, pick([C.lemon, C.pink, C.mint, C.cobalt]), 30, 300);
      ringFx(x, y, C.lemon, 160, .7); popText(x, y - 60, 'MAX +2000', C.lemon);
    }
  };
}
const demoHooks = { onMerge(nb){ burst(nb.x, nb.y, CAP[nb.lvl], 8, 100); ringFx(nb.x, nb.y, CAP[nb.lvl], nb.r * 1.4, .4); } };

function drop(){
  if (state !== 'play' || !G || G.card || G.over || G.cool > 0) return;
  const r = RAD[G.cur], x = Math.max(BOX_L + r, Math.min(BOX_R - r, G.aim));
  addBody(world, G.cur, x, HOLD_Y, 0, 80);
  sfx.drop();
  G.cur = G.next; G.next = Math.floor(rnd(0, 5)); G.seen.add(G.cur === undefined ? 0 : G.cur);
  G.cool = .45;
}
function countsForDanger(b){ return b.age > 1.4 && b.y - b.r < LINE_Y && b.vx * b.vx + b.vy * b.vy < 120 * 120; }

function update(dt){
  tsky += dt;
  for (const s of stars) { s.ph += dt; }
  shootT -= dt;
  if (shootT <= 0 && !shoot) { shoot = { x: rnd(120, 340), y: rnd(10, 90), t: 0 }; shootT = rnd(6, 12); }
  if (shoot) { shoot.t += dt; shoot.x -= 260 * dt; shoot.y += 130 * dt; if (shoot.t > .8) shoot = null; }

  if (state === 'title') {
    world.floor = floorY();
    demoT += dt;
    if (demoT > .6) {
      demoT = 0;
      if (world.bodies.length < 44) addBody(world, Math.floor(rnd(0, 5)), rnd(BOX_L + 30, BOX_R - 30), HOLD_Y, rnd(-30, 30), 60);
      if (world.bodies.some(b => b.y - b.r < LINE_Y + 10 && b.age > 1)) {
        world.bodies.sort((p, q) => p.y - q.y);
        world.bodies.splice(0, 10).forEach(b => { burst(b.x, b.y, CAP[b.lvl], 8, 120); });
      }
    }
    stepWorld(world, dt, demoHooks);
    fxUpdate(dt);
    return;
  }
  if (state !== 'play') { fxUpdate(dt); return; }

  if (G.card) {
    const c = G.card; c.t += dt; fxUpdate(dt);
    if (c.skip || (c.t >= 4 && c.spoken) || c.t >= 9) { G.card = null; NYGVocab.stop(); gameOver(); }

}
function fxUpdate(dt){

  for (const p of pops) { p.t += dt; p.y -= 30 * dt; }
  pops = pops.filter(p => p.t < .9);

    G.shake = Math.max(0, G.shake - dt * 2); G.flash = Math.max(0, G.flash - dt * 2.5); G.wflash = Math.max(0, G.wflash - dt * 4);

  }
}
function gameEnd(){

  ringFx(W / 2, (LINE_Y + floorY()) / 2, C.pink, 230, .7); ringFx(W / 2, (LINE_Y + floorY()) / 2, C.lemon, 170, .6);
  world.bodies = [];

  setTimeout(() => { if (G && G.card) NYGVocab.speak(G.card, muted); }, 500);

}

function wrapText(text, maxW){
  const lines = []; let line = '';
  for (const ch of text) {
    const t = line + ch;
    if (ctx.measureText(t).width > maxW && line) {
      const sp = line.lastIndexOf(' ');
      if (ch !== ' ' && sp > 4 && /[A-Za-z]/.test(ch) && /[A-Za-z]$/.test(line)) { lines.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
      else { lines.push(line.trim()); line = ch === ' ' ? '' : ch; }
    } else line = t;
  }
  if (line.trim()) lines.push(line.trim());
  return lines;
}

/* ---------- 화면 크기 ---------- */
function fit(){
  const r = wrapEl.getBoundingClientRect(), aw = Math.max(200, r.width), ah = Math.max(300, r.height - 4);
  H = Math.round(Math.min(780, Math.max(560, W * ah / aw)));
  scale = Math.min(aw / W, ah / H);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  stageEl.style.width = cw + 'px'; stageEl.style.height = ch + 'px';
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  world.floor = floorY();
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(wrapEl);

/* ---------- 조작 ---------- */
const keys = { left: false, right: false };
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = true; e.preventDefault(); }
  else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = true; e.preventDefault(); }
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); }
  else if ((e.key === 'Enter' || e.key === ' ') && state === 'play' && G) { if (G.card) { if (G.card.t > 1.5) G.card.skip = true; } else drop(); e.preventDefault(); }
  else if ((e.key === 'Enter' || e.key === ' ') && state === 'title' && document.activeElement === document.body) { start(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
const toX = e => { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; };
let drag = null;
cv.addEventListener('pointerdown', e => {
  if (state !== 'play' || !G) return;
  if (G.card) { if (G.card.t > 1.5) G.card.skip = true; return; }
  G.aim = toX(e); drag = e.pointerId;
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener('pointermove', e => {
  if (state !== 'play' || !G || G.card) return;
  if (drag === e.pointerId || (e.pointerType === 'mouse' && drag === null)) G.aim = toX(e);
});
cv.addEventListener('pointerup', e => { if (drag !== null && e.pointerId === drag) { drag = null; if (state === 'play' && G) { G.aim = toX(e); drop(); } } });
cv.addEventListener('pointercancel', e => { if (e.pointerId === drag) drag = null; });

function start(){
  armed = true; ac(); sfx.coin();
  $('ovTitle').hidden = true; $('ovOver').hidden = true; $('ovPause').hidden = true;
  newGame(); state = 'play'; last = performance.now();
}
function togglePause(){
  if (state === 'play') { state = 'paused'; $('ovPause').hidden = false; $('resumeBtn').focus(); }
  else if (state === 'paused') { state = 'play'; $('ovPause').hidden = true; last = performance.now(); }
}
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('resumeBtn').addEventListener('click', togglePause);
$('pauseBtn').addEventListener('click', togglePause);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
function syncSound(){ $('soundBtn').textContent = muted ? '소리 끔' : '소리 켬'; $('soundBtn').setAttribute('aria-pressed', String(muted)); }
$('soundBtn').addEventListener('click', () => { muted = !muted; if (muted) NYGVocab.stop(); store.set('nyg-merge-muted', muted); syncSound(); if (!muted && armed) { ac(); tone(880, .08, 'square', .04); } });
$('copyBtn').addEventListener('click', () => {
  const text = NYGProof.text('캐릭터 합치기', G.score, ['최고 캐릭터 ' + CH[G.best].name + ' · 합친 횟수 ' + G.merges + '번']);
  const box = $('copyBox'), msg = $('copyMsg');
  const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); msg.textContent = '글자를 길게 눌러 복사해 주세요'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = '복사했어요. 카페 인증 글에 붙여 넣으세요'; }, fallback);
  } catch(e){ fallback(); }
});
function updateHi(){ $('hiTitle').textContent = 'HI-SCORE ' + pad(hi, 6); }

/* ---------- 돌리기 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1 / 30, Math.max(0, (now - last) / 1000)); last = now;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}
function boot(data){
  if (data && typeof data.hi === 'number' && data.hi > hi) hi = data.hi;
  updateHi(); syncSound(); fit();
  try { window.claude?.hot?.snapshot?.(() => ({ hi })); } catch(e){}
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('10px "Press Start 2P"'), document.fonts.load('19px "Do Hyeon"')]).catch(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
