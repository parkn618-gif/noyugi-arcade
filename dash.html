<style>
[hidden]{display:none!important}
/* Layout: 오락실 기계 한 대 — 위 간판, 가운데 화면(캔버스가 높이를 꽉 채움), 아래 단추 줄. 한 가지 화면(어두운 브라운관)만 쓴다 */
:root{
  --void:#0B0A1F; --cab:#15133A; --ink:#EEF0FF; --dim:#8C90C8; --line:#2B2A66;
  --pink:#FF4F8B; --lemon:#FFD43B; --mint:#3BE0B4; --cobalt:#5C6CFF;
  --f-pixel:'Press Start 2P',ui-monospace,monospace;
  --f-head:'Do Hyeon','Gowun Dodum',system-ui,sans-serif;
  --f-body:'Gowun Dodum',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0; background:var(--void); color:var(--ink); font-family:var(--f-body); overflow:hidden;
  background-image:radial-gradient(circle at 1px 1px, rgba(92,108,255,.14) 1px, transparent 0); background-size:14px 14px}
#app{height:100%; display:flex; flex-direction:column; align-items:center; padding-inline:16px; box-sizing:border-box}
.marquee{flex:none; display:flex; align-items:baseline; justify-content:center; gap:10px; padding-block:8px 6px}
.marquee b{font-family:var(--f-pixel); font-weight:400; font-size:12px; letter-spacing:.12em; color:var(--lemon);
  text-shadow:0 0 6px rgba(255,212,59,.6), 2px 2px 0 var(--pink)}
.marquee span{font-family:var(--f-head); font-size:14px; color:var(--dim)}
#wrap{flex:1; min-height:0; width:100%; display:grid; place-items:center}
#stage{position:relative; border-radius:10px; overflow:hidden; box-shadow:0 0 0 3px var(--line), 0 0 40px rgba(92,108,255,.25);
  touch-action:none; user-select:none; -webkit-user-select:none; background:var(--void)}
#cv{display:block}
#stage::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.14) 2px 3px),
             radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.4) 100%)}
.ov{position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:14px; padding:24px 18px; text-align:center; background:rgba(11,10,31,.62)}
.ov.top{justify-content:flex-start; padding-top:34px; background:linear-gradient(to bottom, rgba(11,10,31,.9) 0%, rgba(11,10,31,.78) 52%, rgba(11,10,31,0) 78%)}
.eyebrow{font-family:var(--f-head); font-size:16px; color:var(--mint); letter-spacing:.04em}
.logo{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:clamp(22px,7.4vw,32px); line-height:1.35; color:var(--lemon);
  text-shadow:3px 3px 0 var(--pink), 6px 6px 0 var(--cobalt); text-wrap:balance}
.how{max-width:29ch; margin:0; font-size:15px; line-height:1.7; color:var(--ink)}
.how em{font-style:normal; color:var(--lemon)}
.btn{font-family:var(--f-head); font-size:22px; border:3px solid var(--ink); border-radius:12px; padding:10px 22px 8px;
  background:var(--lemon); color:var(--void); cursor:pointer; box-shadow:0 5px 0 var(--pink)}
.btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--pink)}
.btn.ghost{background:transparent; color:var(--ink); box-shadow:0 5px 0 var(--line); font-size:18px}
.btn:focus-visible,.mini:focus-visible{outline:3px solid var(--mint); outline-offset:3px}
.coin{font-family:var(--f-pixel); font-size:11px; color:var(--pink); animation:blink 1.1s steps(2) infinite}
.hi{font-family:var(--f-pixel); font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.15}}
.big{margin:0; font-family:var(--f-pixel); font-weight:400; font-size:26px; color:var(--pink); text-shadow:3px 3px 0 var(--cobalt)}
.stats{display:grid; grid-template-columns:auto auto; gap:6px 18px; font-size:15px; align-items:baseline; margin:0}
.stats dt{color:var(--dim); text-align:right}

.record{margin:0; font-family:var(--f-head); font-size:19px; color:var(--lemon)}

.words span{font-family:var(--f-pixel); font-size:10px; padding:5px 7px 4px; border:2px solid var(--mint); color:var(--mint); border-radius:6px}

.row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center}

  width:100%; max-width:480px; justify-content:space-between}
.mini{font-family:var(--f-head); font-size:15px; background:var(--cab); color:var(--ink); border:2px solid var(--line);
  border-radius:9px; padding:5px 12px 3px; cursor:pointer}
.mini[aria-pressed="true"]{color:var(--dim)}
.copy{font-size:12px; color:var(--dim)}
@media (prefers-reduced-motion: reduce){ .coin{animation:none} }
</style>

</div>

<script>
(() => {
'use strict';
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), stageEl = $('stage'), wrapEl = $('wrap');
const W = 360; let H = 640, GY = 474, scale = 1, dpr = 1;
const FP = '"Press Start 2P", monospace', FK = '"Do Hyeon", sans-serif', FB = '"Gowun Dodum", sans-serif';
const C = { void:'#0B0A1F', ink:'#EEF0FF', dim:'#8C90C8', line:'#2B2A66', pink:'#FF4F8B', lemon:'#FFD43B', mint:'#3BE0B4', cobalt:'#5C6CFF', letter:'#141433' };
const TAU = Math.PI * 2;
const HX = 84;                 // 주인공 가로 위치(고정)
const PX_PER_M = 50;           // 50픽셀 = 1m
const PHASE_M = 400;           // 400m 마다 시간대가 바뀐다

/* ---------- 저장(이 기기에만) ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let hi = store.get('nyg-dash-hi', 0);
let muted = store.get('nyg-dash-muted', false);

/* ---------- 공용 파일 (없어도 게임은 돈다) ---------- */
const V = window.NYGVocab || {
  next(){ return ['bounce back', '다시 회복하다']; },
  speak(card){ card.spoken = true; },
  stop(){}
};
const IMG = {};
const charById = id => (window.NYG ? window.NYG.byId(id) : null);
function loadImages(){
  if (!window.NYG) return;
  window.NYG.chars.forEach(c => { window.NYG.image(c, 120).then(img => { IMG[c.id] = img; }, () => {}); });
}
const RARE_COL = { N:'#8ED1FC', R:'#5EDCB8', SR:'#B98CFF', SSR:'#FFC93C' };

/* ---------- 소리 ---------- */
let AC = null;
function ac(){
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, type, v, f2, delay){
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .03);
}
let noiseBuf = null;
function noise(d, v){
  if (muted) return; const a = ac(); if (!a) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, a.sampleRate * .6, a.sampleRate); const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter(), t = a.currentTime;
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(2400, t); f.frequency.exponentialRampToValueAtTime(200, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  s.connect(f).connect(g).connect(a.destination); s.start(t); s.stop(t + d);
}
const sfx = {
  jump(){ tone(360, .12, 'square', .03, 760); },
  jump2(){ tone(560, .12, 'square', .03, 1150); },
  land(){ noise(.07, .025); },
  stomp(){ tone(280, .07, 'square', .05, 900); tone(900, .1, 'triangle', .04, null, .05); },
  smash(){ noise(.16, .06); tone(200, .1, 'sawtooth', .03, 90); },
  get(){ tone(660, .07, 'square', .04); tone(990, .1, 'square', .04, null, .06); },
  dust(){ tone(880, .05, 'square', .02); },
  word(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .13, 'square', .05, null, i * .08)); },
  dash(){ noise(.5, .05); tone(260, .6, 'sawtooth', .03, 900); },
  hurt(){ tone(320, .55, 'sawtooth', .07, 50); noise(.5, .14); },
  shield(){ tone(740, .22, 'triangle', .05, 280); noise(.12, .04); },
  helper(){ [523, 659, 784, 988, 1319].forEach((f, i) => tone(f, .1, 'triangle', .06, null, i * .055)); },
  phase(){ [392, 523, 659].forEach((f, i) => tone(f, .14, 'triangle', .045, null, i * .1)); },
  coin(){ tone(988, .07, 'square', .05); tone(1319, .28, 'square', .05, null, .07); },
  over(){ [392, 330, 262, 196].forEach((f, i) => tone(f, .28, 'triangle', .08, null, i * .24)); }
};

/* ---------- 도구 ---------- */
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const pad = (n, l) => String(Math.floor(n)).padStart(l, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
function rr(x, y, w, h, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
}

/* ---------- 단어 ---------- */
const WORDS = {
  3: [['SUN','해'],['SKY','하늘'],['BUS','버스'],['PEN','펜'],['BAG','가방'],['MAP','지도'],['CUP','컵'],['KEY','열쇠'],['BOX','상자'],['ICE','얼음'],['OWL','부엉이'],['FOX','여우'],['BEE','꿀벌'],['JAM','잼'],['HAT','모자'],['ART','미술'],['RUN','달리다'],['WIN','이기다'],['FUN','재미'],['JOY','기쁨']],
  4: [['BOOK','책'],['DESK','책상'],['LAMP','등'],['STAR','별'],['MOON','달'],['ROAD','길'],['RAIN','비'],['SNOW','눈'],['WIND','바람'],['JUMP','뛰다'],['KITE','연'],['CAKE','케이크'],['GOLD','금'],['BELL','종'],['TREE','나무'],['SHOE','신발'],['FISH','물고기'],['BIRD','새'],['NOTE','필기, 메모'],['CLUB','동아리']],
  5: [['CLASS','수업, 반'],['NIGHT','밤'],['DREAM','꿈'],['LIGHT','빛'],['TRAIN','기차'],['CLOCK','시계'],['PAPER','종이'],['SMILE','미소'],['HAPPY','행복한'],['BRAVE','용감한'],['LUCKY','운 좋은'],['MUSIC','음악'],['PIZZA','피자'],['TIGER','호랑이'],['SHINE','빛나다'],['STORM','폭풍']],
  6: [['SCHOOL','학교'],['STREET','거리'],['WINDOW','창문'],['PENCIL','연필'],['LOCKER','사물함'],['SUNSET','노을'],['BRIGHT','밝은'],['FRIEND','친구'],['CAMPUS','캠퍼스'],['ROCKET','로켓']]
};
const FILL = 'ABCDEFGHIJKLMNOPRSTUVWY';
function wordLen(m){ return m < 250 ? 3 : m < 600 ? pick([3, 4]) : m < 1100 ? pick([4, 5]) : pick([4, 5, 6]); }

/* ---------- 도움 캐릭터 (SR · SSR) ---------- */
const HELP = {
  rabbit:  { kind:'magnet', tag:'MAGNET', ko:'글자를 끌어당겨요' },
  cloud:   { kind:'shield', tag:'SHIELD', ko:'한 번 막아 줘요' },
  fox:     { kind:'double', tag:'x2',     ko:'점수가 두 배' },
  dragon:  { kind:'all',    tag:'SUPER',  ko:'자석 · 방패 · 두 배' },
  unicorn: { kind:'all',    tag:'SUPER',  ko:'자석 · 방패 · 두 배' }
};
const HELP_SR = ['rabbit', 'cloud', 'fox'], HELP_SSR = ['dragon', 'unicorn'];
const BLOCK_N = ['comma', 'period', 'twins', 'question', 'exclaim', 'apos'];
const BLOCK_R = ['verb', 'adj', 'adv', 'noun', 'prep'];

/* ---------- 시간대 (저녁 → 밤 → 새벽) ---------- */
const hexRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const PH = [
  { name:'EVENING', ko:'저녁', skyT:'#2D2A6E', skyB:'#FF8F6B', far:'#4B3270', mid:'#34224F', near:'#241838', walk:'#4A3A63', road:'#2A2140', win:.55, star:.15 },
  { name:'NIGHT',   ko:'밤',   skyT:'#070616', skyB:'#1D1B52', far:'#15133D', mid:'#0F0E2D', near:'#0A0A22', walk:'#262552', road:'#14132F', win:1,   star:1 },
  { name:'DAWN',    ko:'새벽', skyT:'#3B4A9E', skyB:'#FFB3A7', far:'#6A5A9A', mid:'#4B3F7A', near:'#33295A', walk:'#5A5287', road:'#2B2650', win:.3,  star:.3 }
];
['skyT', 'skyB', 'far', 'mid', 'near', 'walk', 'road'].forEach(k => PH.forEach(p => { p[k] = hexRgb(p[k]); }));
function phaseWeights(m){
  const p = m / PHASE_M, i = Math.floor(p) % 3, f = p - Math.floor(p);
  const t = f < .8 ? 0 : (f - .8) / .2, s = t * t * (3 - 2 * t), w = [0, 0, 0];
  w[i] += 1 - s; w[(i + 1) % 3] += s; return w;
}
function mixKey(w, key){ const o = [0, 0, 0]; for (let k = 0; k < 3; k++) for (let c = 0; c < 3; c++) o[c] += PH[k][key][c] * w[k]; return o; }
const rgb = a => 'rgb(' + Math.round(a[0]) + ',' + Math.round(a[1]) + ',' + Math.round(a[2]) + ')';

/* ---------- 장애물 (우리가 코드로 그린 문구류) ---------- */
const BOOK_COLS = ['#FF4F8B', '#5C6CFF', '#3BE0B4', '#FFD43B', '#FF8A3D', '#9B7BFF'];
const PROPS = ['books', 'eraser', 'holder', 'tape', 'stapler'];
function makeProp(type){
  const o = { kind:'prop', type, x: W + 60, dead: 0, landed: false };
  if (type === 'books') { o.n = pick([2, 3]); o.w = 44; o.h = o.n * 17; o.name = 'BOOKS'; o.cols = []; o.offs = []; for (let i = 0; i < o.n; i++) { o.cols.push(pick(BOOK_COLS)); o.offs.push(Math.round(rnd(-2, 3))); } }
  else if (type === 'eraser') { o.w = 42; o.h = 24; o.name = 'ERASER'; }
  else if (type === 'holder') { o.w = 34; o.h = 50; o.name = 'PENCIL HOLDER'; }
  else if (type === 'tape') { o.w = 36; o.h = 36; o.name = 'TAPE'; }
  else { o.w = 48; o.h = 22; o.name = 'STAPLER'; }
  return o;
}
function drawProp(o){
  const x = o.x, b = GY;
  ctx.save(); ctx.lineJoin = 'round';
  if (o.type === 'books') {
    let y = b;
    for (let i = 0; i < o.n; i++) {
      y -= 17; const ox = x - 20 + o.offs[i];
      ctx.fillStyle = o.cols[i]; ctx.fillRect(ox, y, 40, 16);
      ctx.fillStyle = '#F4EBD8'; ctx.fillRect(ox + 33, y + 2, 7, 12);
      ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(ox + 5, y + 4, 16, 2); ctx.fillRect(ox + 5, y + 9, 10, 2);
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(ox, y + 14, 40, 2);
      ctx.strokeStyle = C.void; ctx.lineWidth = 1.5; ctx.strokeRect(ox + .5, y + .5, 39, 15);
    }
  } else if (o.type === 'eraser') {
    rr(x - 21, b - 24, 42, 24, 5); ctx.fillStyle = '#FFE3EC'; ctx.fill();
    ctx.fillStyle = '#E8A9BF'; ctx.fillRect(x + 8, b - 22, 11, 20);
    ctx.fillStyle = C.cobalt; ctx.fillRect(x - 12, b - 24, 18, 24);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(x - 10, b - 17, 14, 2); ctx.fillRect(x - 10, b - 11, 9, 2);
    rr(x - 21, b - 24, 42, 24, 5); ctx.strokeStyle = C.void; ctx.lineWidth = 1.5; ctx.stroke();
  } else if (o.type === 'holder') {
    const cols = ['#FF4F8B', '#FFD43B', '#5C6CFF'], ang = [-.28, .02, .3];
    for (let i = 0; i < 3; i++) {
      ctx.save(); ctx.translate(x + (i - 1) * 8, b - 30); ctx.rotate(ang[i]);
      ctx.fillStyle = cols[i]; ctx.fillRect(-3, -20, 6, 22);
      ctx.fillStyle = '#F2C38B'; ctx.beginPath(); ctx.moveTo(-3, -20); ctx.lineTo(3, -20); ctx.lineTo(0, -27); ctx.closePath(); ctx.fill();
      ctx.fillStyle = C.void; ctx.fillRect(-1, -27, 2, 2);
      ctx.restore();
    }
    rr(x - 17, b - 34, 34, 34, 5); ctx.fillStyle = C.mint; ctx.fill();
    ctx.fillStyle = '#1E9C7C'; ctx.fillRect(x - 17, b - 8, 34, 8);
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x - 10, b - 28, 4, 14); ctx.fillRect(x - 2, b - 24, 3, 3); ctx.fillRect(x + 7, b - 19, 3, 3);

    ctx.beginPath(); ctx.arc(x, b - 18, 7, 0, TAU); ctx.fillStyle = C.void; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillRect(x - 14, b - 28, 5, 3);

    ctx.fillStyle = C.lemon; ctx.fillRect(x - 18, b - 20, 30, 3);

/* ---------- 상태 ---------- */
let state = 'title', G = null, bgx = 0;
const input = { held: false };
const STARS = Array.from({ length: 46 }, (_, i) => ({ x: hash(i * 2.3) * W, y: hash(i * 5.9 + 1) , s: hash(i * 3.3) < .2 ? 2 : 1, p: hash(i * 8.1) * 6 }));

function newGame(demo){
  G = { demo: !!demo, score: 0, distM: 0, lives: 3, t: 0, words: [], recent: [], word: null, wordWait: 0,
    z: 0, prevZ: 0, vz: 0, jumps: 0, grounded: true, holdT: 99, buf: 0, jumpReq: false, spin: 0, runPh: 0, demoHold: 0,
    inv: 0, dead: false, speed: 250, mulCur: 1,
    sinceObs: -80, gapNext: 320, sinceLetter: 0, letterGap: 160, nextHelperM: rnd(300, 450),
    magnet: 0, double: 0, shield: 0, dash: 0,
    obs: [], letters: [], helpers: [], parts: [], rings: [], floaters: [], pops: [], banners: [],
    card: null, shake: 0, flash: 0, wflash: 0, phaseShown: 0, stomps: 0 };
  input.held = false;
  pickWord();
  if (!demo) banner('RUN!', '누르면 점프', C.mint);
}
function pickWord(){
  const g = G, len = wordLen(g.distM);
  let pool = WORDS[len].filter(w => !g.recent.includes(w[0]));
  if (!pool.length) pool = WORDS[len];
  const p = pick(pool);
  g.recent.push(p[0]); if (g.recent.length > 14) g.recent.shift();
  g.word = { w: p[0], ko: p[1], got: Array(len).fill(0) };
}
function neededIndex(ch){
  const w = G.word; if (!w) return -1;
  for (let i = 0; i < w.w.length; i++) if (w.w[i] === ch && !w.got[i]) return i;
  return -1;
}
function banner(text, sub, color, big){ G.banners.push({ text, sub, color: color || C.lemon, t: 0, life: big ? 1.9 : 1.5, big: !!big }); }
function burst(x, y, color, n, spd, grav){
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(30, spd || 150);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(.35, .8), t: 0, color, size: pick([2, 2, 3]), g: grav || 0 }); }
}
function pop(x, y, text, color){ G.pops.push({ x, y, text, t: 0, color: color || C.lemon }); }
function addScore(n){ if (G.demo) return; G.score += n * (G.double > 0 ? 2 : 1); }
function hudSlot(i, len){ const size = 22, gap = 5, total = len * size + (len - 1) * gap; return { x: W / 2 - total / 2 + i * (size + gap), y: 30, size }; }
function baseSpeed(g){ return g.demo ? 230 : Math.min(460, 250 + g.distM * .21); }

/* ---------- 점프 · 부딪힘 ---------- */
function doJump(){
  const g = G;
  if (g.grounded) { g.vz = 470; g.grounded = false; g.jumps = 1; g.holdT = 0; sfx.jump(); dustAt(10); }
  else if (g.jumps < 2) { g.vz = 430; g.jumps = 2; g.holdT = 0; g.spin = .45; sfx.jump2(); burst(HX, GY - g.z - 8, C.mint, 8, 90); }
  else g.buf = .1;
}
function dustAt(n){ const g = G; for (let i = 0; i < n; i++) g.parts.push({ x: HX - 6 + rnd(-4, 4), y: GY - 2, vx: -g.speed * .35 + rnd(-30, 20), vy: rnd(-40, -5), life: rnd(.25, .5), t: 0, color: '#B9BEE6', size: pick([2, 2, 3]), g: 0 }); }
function land(){
  const g = G; g.grounded = true; g.jumps = 0; g.vz = 0; g.holdT = 99;
  if (!g.demo) sfx.land();
  dustAt(6);
  if (g.buf > 0) { g.buf = 0; doJump(); }
}
function overlapX(o, extra){ return Math.abs(HX - o.x) < o.w / 2 + 10 + (extra || 0); }
function floorUnder(){
  let f = 0;
  for (const o of G.obs) if (o.kind === 'prop' && !o.dead && overlapX(o) && o.h > f) f = o.h;
  return f;
}
function smash(o){
  o.dead = .35; const g = G;
  const col = o.kind === 'char' ? RARE_COL[o.c.r] : C.lemon;
  burst(o.x, GY - o.h / 2, col, 16, 200, 300); burst(o.x, GY - o.h / 2, '#FFFFFF', 5, 120, 200);
  sfx.smash(); const pts = o.kind === 'char' ? (o.c.r === 'R' ? 80 : 50) : 30;
  addScore(pts); pop(o.x, GY - o.h - 8, (o.kind === 'char' ? o.c.en : o.name) + ' +' + pts, col);
}
function stomp(o){
  const g = G; o.dead = .5; o.stomped = true;
  g.vz = 520; g.grounded = false; g.jumps = 1; g.holdT = 99; g.stomps++;
  const pts = o.c.r === 'R' ? 120 : 60; addScore(pts);
  burst(o.x, GY - o.h, RARE_COL[o.c.r], 14, 170, 260); burst(o.x, GY - o.h, '#FFFFFF', 6, 110, 200);
  g.rings.push({ x: o.x, y: GY - o.h, t: 0, life: .35, r: 34, color: RARE_COL[o.c.r] });
  pop(o.x, GY - o.h - 14, o.c.en + ' +' + pts, RARE_COL[o.c.r]);
  sfx.stomp();
}
function hurt(src){
  const g = G;
  if (g.demo || g.inv > 0 || g.dash > 0 || g.card || g.dead) return;
  if (g.shield > 0) {
    g.shield--; g.inv = 1.3; sfx.shield();
    g.rings.push({ x: HX, y: GY - g.z - 22, t: 0, life: .5, r: 60, color: C.mint });
    burst(HX, GY - g.z - 22, C.mint, 18, 160);
    pop(HX, GY - g.z - 54, 'SHIELD', C.mint);
    if (src) { src.dead = .3; burst(src.x, GY - src.h / 2, C.lemon, 10, 150, 200); }
    return;
  }
  g.lives--; g.dead = true; g.shake = RM ? 0 : .7; g.wflash = RM ? 0 : 1;
  const cy = GY - g.z - 24;
  burst(HX, cy, C.lemon, 40, 260, 120); burst(HX, cy, C.pink, 30, 200, 120); burst(HX, cy, '#FFFFFF', 14, 120);
  burst(HX, cy, '#5B8CFF', 18, 180, 120);
  g.rings.push({ x: HX, y: cy, t: 0, life: .6, r: 170, color: C.lemon }, { x: HX, y: cy, t: -.12, life: .7, r: 120, color: C.pink });
  const v = V.next(); g.card = { en: v[0], ko: v[1], t: 0, spoken: false, skip: false };
  setTimeout(() => { if (G && G.card) V.speak(G.card, muted); }, 500);
  sfx.hurt(); g.dash = 0; input.held = false;
  if (navigator.vibrate) try { navigator.vibrate(120); } catch(e){}
}
function respawn(){
  const g = G; g.card = null; V.stop();
  g.dead = false; g.z = 0; g.vz = 0; g.grounded = true; g.jumps = 0; g.inv = 2.4; g.spin = 0;
  g.obs = g.obs.filter(o => o.x < HX - 90 || o.x > HX + 260);
  g.mulCur = 1;
}

/* ---------- 낱말 · 도움 ---------- */
function completeWord(){
  const g = G, w = g.word; if (!w) return;
  const bonus = 100 * w.w.length;
  addScore(bonus); g.words.push(w.w); g.dash = 4.2; g.flash = RM ? 0 : .6;
  banner(w.w + '!', w.ko + ' · +' + bonus + ' · 무적 질주', C.lemon, true);
  sfx.word(); setTimeout(sfx.dash, 350);
  g.word = null; g.wordWait = 5;
}
function giveHelp(h){
  const g = G, c = h.c, d = HELP[c.id], k = d.kind;
  if (k === 'magnet' || k === 'all') g.magnet = k === 'all' ? 16 : 12;
  if (k === 'double' || k === 'all') g.double = k === 'all' ? 16 : 12;
  if (k === 'shield' || k === 'all') g.shield = Math.min(2, g.shield + (k === 'all' ? 2 : 1));
  const col = RARE_COL[c.r];
  banner(d.tag, c.name + ' · ' + d.ko, col, c.r === 'SSR');
  g.rings.push({ x: HX, y: GY - g.z - 22, t: 0, life: .55, r: 90, color: col });
  burst(h.x, h.y, col, 24, 200); burst(h.x, h.y, '#FFFFFF', 8, 120);
  addScore(c.r === 'SSR' ? 300 : 100);
  sfx.helper();
}
function spawnObstacle(){
  const g = G, m = g.distM, sp = g.speed;
  let o;
  const charChance = Math.min(.45, .22 + m / 4000);
  if (Math.random() < charChance) {
    const rChance = Math.min(.55, .25 + m / 3000);
    const id = Math.random() < rChance ? pick(BLOCK_R) : pick(BLOCK_N);
    const c = charById(id);
    o = c ? { kind:'char', c, x: W + 60, w: 40, h: 44, dead: 0, ph: Math.random() * 6, walk: c.r === 'R' ? 45 : 0, stomped: false }
          : makeProp(pick(PROPS));
  } else o = makeProp(pick(PROPS));
  g.obs.push(o);
  g.sinceObs = 0; g.gapNext = sp * .85 + o.w + rnd(0, 230);
}
function spawnLetter(){
  const g = G, w = g.word;
  let ch;
  const missing = [];
  if (w) for (let i = 0; i < w.w.length; i++) if (!w.got[i]) missing.push(w.w[i]);
  if (missing.length && Math.random() < .62) ch = pick(missing); else ch = pick(FILL);
  const r = Math.random(); let y = r < .3 ? 38 : r < .78 ? 92 : 148;
  const x = W + 24;
  for (const o of g.obs) if (Math.abs(o.x - x) < o.w / 2 + 28 && y < o.h + 30) y = o.h + 62;
  g.letters.push({ x, y, ch, ph: Math.random() * 6 });
}
function spawnHelper(){
  const g = G, id = Math.random() < .14 ? pick(HELP_SSR) : pick(HELP_SR), c = charById(id);
  if (!c) return;
  g.helpers.push({ c, x: W + 40, y: GY - 92, ph: 0 });
}

/* ---------- 갱신 ---------- */
function fxStep(dt){
  const g = G;
  for (const p of g.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .98; p.vy *= .98; if (p.g) p.vy += p.g * dt; }
  g.parts = g.parts.filter(p => p.t < p.life);
  for (const r of g.rings) r.t += dt;
  g.rings = g.rings.filter(r => r.t < r.life);
  for (const p of g.pops) { p.t += dt; p.y -= 26 * dt; }
  g.pops = g.pops.filter(p => p.t < .9);
  for (const b of g.banners) b.t += dt;
  g.banners = g.banners.filter(b => b.t < b.life);
  g.shake = Math.max(0, g.shake - dt * 2); g.flash = Math.max(0, g.flash - dt * 3); g.wflash = Math.max(0, g.wflash - dt * 4);
}
function update(dt){
  if (!G) return;
  if (state === 'title') { stepWorld(dt); return; }
  if (state === 'over') { fxStep(dt); return; }
  if (state !== 'play') return;
  if (G.card) {
    const c = G.card; c.t += dt; fxStep(dt);
    if (c.skip || (c.t >= 4 && c.spoken) || c.t >= 9) {
      V.stop();
      if (G.lives <= 0) gameOver(); else respawn();
    }
    return;
  }
  stepWorld(dt);
}
function stepWorld(dt){
  const g = G;
  g.t += dt;
  // 속도 · 거리
  const target = g.dash > 0 ? 1.6 : 1;
  g.mulCur += (target - g.mulCur) * Math.min(1, dt * 5);
  g.speed = baseSpeed(g) * g.mulCur;
  const sp = g.speed;
  const dm = sp * dt / PX_PER_M; g.distM += dm; if (!g.demo) g.score += dm * (g.double > 0 ? 2 : 1);
  bgx += sp * dt; g.runPh += sp * dt / 26;
  if (!g.demo && Math.floor(g.distM / PHASE_M) > g.phaseShown) {
    g.phaseShown = Math.floor(g.distM / PHASE_M); const p = PH[g.phaseShown % 3];
    banner(p.name, p.ko, C.cobalt); sfx.phase();
  }
  // 타이머
  if (g.dash > 0) { g.dash -= dt; if (g.dash <= 0) { g.dash = 0; g.inv = Math.max(g.inv, 1); } }
  g.magnet = Math.max(0, g.magnet - dt); g.double = Math.max(0, g.double - dt);
  g.inv = Math.max(0, g.inv - dt); g.spin = Math.max(0, g.spin - dt); g.buf = Math.max(0, g.buf - dt); g.demoHold = Math.max(0, g.demoHold - dt);
  if (g.wordWait > 0) { g.wordWait -= dt; if (g.wordWait <= 0 && !g.word) pickWord(); }

  // 데모(첫 화면)에서는 저절로 뛴다
  if (g.demo && g.grounded) {
    for (const o of g.obs) { const d = o.x - o.w / 2 - (HX + 12); if (!o.dead && d > 0 && d < sp * .27 + 4) { g.jumpReq = true; g.demoHold = o.h > 38 ? .28 : 0; break; } }
  }

  // 장애물 · 글자 · 도움 만들기
  g.sinceObs += sp * dt;
  if (g.sinceObs >= g.gapNext) spawnObstacle();
  g.sinceLetter += sp * dt;
  if (g.sinceLetter >= g.letterGap) { spawnLetter(); g.sinceLetter = 0; g.letterGap = rnd(170, 300); }
  if (g.distM >= g.nextHelperM) { spawnHelper(); g.nextHelperM = g.distM + rnd(380, 650); }

  // 움직이기
  for (const o of g.obs) { o.x -= (sp + (o.walk || 0)) * dt; if (o.dead > 0) { o.dead -= dt; if (o.dead <= 0) o.gone = true; } if (o.kind === 'char') o.ph += dt * 6; }
  g.obs = g.obs.filter(o => o.x > -80 && !o.gone);
  for (const h of g.helpers) { h.x -= sp * dt; h.ph += dt * 3; }
  g.helpers = g.helpers.filter(h => h.x > -60);

  // 주인공
  if (g.jumpReq) { g.jumpReq = false; if (!g.dead) doJump(); }
  const held = input.held || g.demoHold > 0;
  if (!held && g.vz > 0) g.holdT = 99;
  g.prevZ = g.z;
  const ghost = g.demo || g.inv > 0 || g.dash > 0;
  let floor = ghost ? 0 : floorUnder();
  if (g.grounded && g.z > floor + .5) { g.grounded = false; g.jumps = Math.max(g.jumps, 1); }
  if (!g.grounded) {
    let grav = 1500;
    if (g.vz > 0 && held && g.holdT < .28) { grav = 520; g.holdT += dt; }
    g.vz -= grav * dt; g.z += g.vz * dt;
    if (!ghost) {
      floor = floorUnder();
      if (floor > 0 && g.z <= floor && g.prevZ >= floor - 6 && g.vz <= 0) {
        g.z = floor; land();
        for (const o of g.obs) if (o.kind === 'prop' && !o.landed && overlapX(o) && Math.abs(o.h - floor) < .5) { o.landed = true; addScore(10); pop(o.x, GY - o.h - 8, o.name + ' +10', C.lemon); }
      }
    }
    if (!g.grounded && g.z <= 0) { g.z = 0; land(); }
  }
  // 옆으로 부딪힘 · 캐릭터 밟기
  if (!g.dead) {
    for (const o of g.obs) {
      if (o.dead) continue;
      if (!overlapX(o, o.kind === 'char' ? 4 : 0) || g.z >= o.h) continue;
      if (g.demo) continue;
      if (g.dash > 0) { smash(o); continue; }
      if (o.kind === 'char' && g.vz < 0 && g.prevZ >= o.h - 12) { stomp(o); continue; }
      if (g.inv > 0) continue;
      hurt(o); if (g.dead) break;
    }
  }
  if (g.dead) { fxStep(dt); return; }
  // 질주 꼬리
  if (g.dash > 0 && !RM) {
    const col = pick([C.pink, C.lemon, C.mint, C.cobalt]);
    g.parts.push({ x: HX - 12, y: GY - g.z - rnd(8, 40), vx: -sp * .6, vy: rnd(-15, 15), life: .4, t: 0, color: col, size: 3, g: 0 });
  }
  // 달릴 때 먼지
  if (g.grounded && g.z === 0 && Math.random() < dt * 12) g.parts.push({ x: HX - 8, y: GY - 1, vx: -sp * .3, vy: rnd(-30, -8), life: .3, t: 0, color: '#8C90C8', size: 2, g: 0 });

  // 글자
  const hy = GY - g.z - 22;
  for (const L of g.letters) {
    L.x -= sp * dt; L.ph += dt * 4;
    if (g.magnet > 0 || g.dash > 0) {
      const dx = HX - L.x, dy = hy - (GY - L.y), d = Math.hypot(dx, dy), R = g.dash > 0 ? 220 : 170;
      if (d < R && d > 1) { const v = 340 + (R - d) * 2; L.x += dx / d * v * dt; L.y -= dy / d * v * dt; }
    }
    if (!g.demo && !g.dead && Math.hypot(HX - L.x, hy - (GY - L.y)) < 26) {
      L.taken = true;
      const i = neededIndex(L.ch);
      if (i >= 0) {
        g.word.got[i] = 1;
        const s = hudSlot(i, g.word.w.length);
        g.floaters.push({ ch: L.ch, i, word: g.word.w, sx: L.x, sy: GY - L.y, tx: s.x + s.size / 2, ty: s.y + s.size / 2, x: L.x, y: GY - L.y, t: 0 });
        addScore(40); sfx.get();
      } else { addScore(10); pop(L.x, GY - L.y - 12, '+10', C.dim); sfx.dust(); }
      burst(L.x, GY - L.y, C.lemon, 6, 90);
    }
  }
  g.letters = g.letters.filter(L => L.x > -30 && !L.taken);
  for (const f of g.floaters) {
    f.t += dt; const p = Math.min(1, f.t / .55), q = p * p * (3 - 2 * p);
    f.x = f.sx + (f.tx - f.sx) * q; f.y = f.sy + (f.ty - f.sy) * q - Math.sin(p * Math.PI) * 40;
    if (p >= 1 && !f.done) { f.done = true; if (g.word && g.word.w === f.word) { g.word.got[f.i] = 2; tone(1320, .06, 'square', .04); if (g.word.got.every(v => v === 2)) completeWord(); } }
  }
  g.floaters = g.floaters.filter(f => !f.done);
  // 도움 캐릭터
  for (const h of g.helpers) {
    const hyy = GY - 92 + Math.sin(h.ph) * 8; h.y = hyy;
    if (!g.demo && !g.dead && Math.hypot(HX - h.x, hy - hyy) < 36) { h.taken = true; giveHelp(h); }
  }
  g.helpers = g.helpers.filter(h => !h.taken);
  fxStep(dt);
}

/* ---------- 끝 ---------- */
function gameOver(){
  state = 'over';
  const g = G, sc = Math.floor(g.score), m = Math.floor(g.distM);
  if (sc > hi) { hi = sc; store.set('nyg-dash-hi', hi); }
  sfx.over();
  $('stScore').textContent = sc.toLocaleString('ko-KR');
  $('stHi').textContent = hi.toLocaleString('ko-KR');
  $('stRec').textContent = '달린 거리 ' + m.toLocaleString('ko-KR') + 'm · 완성한 단어 ' + g.words.length + '개';
  const box = $('stWords'); box.textContent = '';
  if (g.words.length) g.words.forEach(w => { const s = document.createElement('span'); s.textContent = w; box.appendChild(s); });
  else { const s = document.createElement('span'); s.className = 'none'; s.textContent = '완성한 단어가 아직 없어요'; box.appendChild(s); }
  $('copyBox').hidden = true; $('copyMsg').textContent = '';
  setTimeout(() => { $('ovOver').hidden = false; $('againBtn').focus(); }, 400);
  updateHi();
}

/* ---------- 그리기 : 배경 ---------- */
function drawSky(w){
  const top = mixKey(w, 'skyT'), bot = mixKey(w, 'skyB');
  const gr = ctx.createLinearGradient(0, 0, 0, GY);
  gr.addColorStop(0, rgb(top)); gr.addColorStop(1, rgb(bot));
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, GY + 2);
  const starA = PH[0].star * w[0] + PH[1].star * w[1] + PH[2].star * w[2], t = performance.now() / 1000;
  if (starA > .02) for (const s of STARS) {
    const x = ((s.x - bgx * .02) % W + W) % W, y = s.y * GY * .7;
    ctx.globalAlpha = starA * (.55 + .45 * Math.sin(t * 2 + s.p)); ctx.fillStyle = C.ink; ctx.fillRect(Math.round(x), Math.round(y), s.s, s.s);
  }
  ctx.globalAlpha = 1;
  // 해 (저녁 · 새벽) 와 달 (밤)
  const sunA = w[0] + w[2];

function fit(){
  const r = wrapEl.getBoundingClientRect(), aw = Math.max(200, r.width), ah = Math.max(300, r.height - 4);
  H = Math.round(Math.min(780, Math.max(560, W * ah / aw)));
  GY = Math.round(H * .74);
  scale = Math.min(aw / W, ah / H);
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
  stageEl.style.width = cw + 'px'; stageEl.style.height = ch + 'px';
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
addEventListener('resize', fit);
if (window.ResizeObserver) new ResizeObserver(fit).observe(wrapEl);

  if (state !== 'play' || !G) return;
  if (G.card) { if (G.card.t > 1.5) G.card.skip = true; return; }
  G.jumpReq = true; input.held = true;
}
function releaseJump(){ input.held = false; }
const isJumpKey = e => e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W';
addEventListener('keydown', e => {
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') { togglePause(); return; }
  if (state === 'title' && (e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body) { start(); e.preventDefault(); return; }
  if (state === 'play' && (isJumpKey(e) || e.key === 'Enter')) { if (!e.repeat) pressJump(); e.preventDefault(); }
});
addEventListener('keyup', e => { if (isJumpKey(e)) releaseJump(); });
cv.addEventListener('pointerdown', e => { e.preventDefault(); pressJump(); try { cv.setPointerCapture(e.pointerId); } catch(_){} });
cv.addEventListener('pointerup', releaseJump); cv.addEventListener('pointercancel', releaseJump);
addEventListener('blur', releaseJump);

function start(){
  ac(); sfx.coin();
  $('ovTitle').hidden = true; $('ovOver').hidden = true; $('ovPause').hidden = true;
  newGame(false); state = 'play';
}
function togglePause(){
  if (state === 'play') { state = 'paused'; input.held = false; $('ovPause').hidden = false; $('resumeBtn').focus(); }
  else if (state === 'paused') { state = 'play'; $('ovPause').hidden = true; last = performance.now(); }
}
$('startBtn').addEventListener('click', start);
$('againBtn').addEventListener('click', start);
$('resumeBtn').addEventListener('click', togglePause);
$('pauseBtn').addEventListener('click', togglePause);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });
function syncSound(){ $('soundBtn').textContent = muted ? '소리 끔' : '소리 켬'; $('soundBtn').setAttribute('aria-pressed', String(muted)); }
$('soundBtn').addEventListener('click', () => { muted = !muted; if (muted) V.stop(); store.set('nyg-dash-muted', muted); syncSound(); if (!muted) { ac(); tone(880, .08, 'square', .04); } });
$('copyBtn').addEventListener('click', () => {
  const g = G, sc = Math.floor(g.score), m = Math.floor(g.distM);
  const text = NYGProof.text('노유기몬 대시', sc, ['달린 거리 ' + m.toLocaleString('ko-KR') + 'm', '완성한 단어 ' + g.words.length + '개' + (g.words.length ? ': ' + g.words.join(' ') : '')]);
  const box = $('copyBox'), msg = $('copyMsg');
  const fallback = () => { box.value = text; box.hidden = false; box.focus(); box.select(); msg.textContent = '글자를 길게 눌러 복사해 주세요'; };
  try {
    navigator.clipboard.writeText(text).then(() => { msg.textContent = '복사했어요. 카페 인증 글에 붙여 넣으세요'; }, fallback);
  } catch(e){ fallback(); }
});
function updateHi(){ $('hiTitle').textContent = 'HI-SCORE ' + pad(hi, 6); }

/* ---------- 돌리기 ---------- */
let last = performance.now();
function frame(now){
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (state !== 'paused') update(dt);
  draw();
  requestAnimationFrame(frame);
}
function boot(data){
  if (data && typeof data.hi === 'number' && data.hi > hi) hi = data.hi;
  updateHi(); syncSound(); fit(); loadImages(); newGame(true);
  try { window.claude?.hot?.snapshot?.(() => ({ hi })); } catch(e){}
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('10px "Press Start 2P"'), document.fonts.load('19px "Do Hyeon"')]).catch(() => {});
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
